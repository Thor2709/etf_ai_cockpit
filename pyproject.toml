[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "etf-ai-cockpit"
version = "0.1.0"
description = "Local ETF AI Portfolio Cockpit for conservative ETF action signals."
readme = "README.md"
requires-python = ">=3.11"
authors = [{ name = "Local project" }]
dependencies = [
  "flet>=0.28",
  "flet-web>=0.85",
  "pandas>=2.2",
  "numpy>=1.26",
  "pyarrow>=15",
  "duckdb>=1.0",
  "plotly>=5.20",
  "pydantic>=2.7",
  "pyyaml>=6.0",
  "python-dotenv>=1.0",
  "requests>=2.32",
  "rich>=13.7",
  "joblib>=1.4",
  "scikit-learn>=1.5",
  "yfinance>=1.5"
]

[project.optional-dependencies]
dev = [
  "pytest>=9,<10",
  "hypothesis>=6.140,<7",
  "ruff>=0.12,<1",
  "mypy>=1.16,<2",
  "pytest-timeout>=2.4,<3"
]
parsers = [
  "arelle-release[esef]>=2.41.4,<2.42",
  "pdfplumber>=0.11.9,<0.12",
  "defusedxml>=0.7.1,<0.8",
  "feedparser>=6.0.11,<7"
]
models = [
  "torch>=2.4.0",
  "safetensors>=0.5.3",
  "huggingface-hub>=0.23.0",
  "transformers>=4.57.0",
  "einops>=0.7.0",
  "gluonts[torch]>=0.16.0",
  "jaxtyping>=0.2.25",
  "dd-unit-scaling>=0.1.0"
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
addopts = "-q -p no:cacheprovider"
