[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "etf-ai-cockpit"
version = "1.1.0b1"
description = "Private local-first investment research and decision-support cockpit."
readme = "README.md"
requires-python = ">=3.11"
authors = [{ name = "Local project" }]
dependencies = [
  "flet>=0.28,<1.0",
  "flet-web>=0.85,<1.0",
  "fastapi<0.145",
  "pandas>=2.2",
  "numpy>=1.26",
  "pyarrow>=15",
  "duckdb>=1.0",
  "plotly>=5.20",
  "pydantic>=2.7",
  "pyyaml>=6.0",
  "python-dotenv>=1.0",
  "requests>=2.32",
  "rich>=13.7",
  "joblib>=1.4",
  "cryptography>=43.0,<51",
  "scikit-learn>=1.5",
  "yfinance>=1.5",
  "exchange-calendars>=4.13,<5"
]

[project.optional-dependencies]
dev = [
  "pytest>=9,<10",
  "hypothesis>=6.140,<7",
  "ruff>=0.12,<1",
  "mypy>=1.16,<2",
  "pytest-timeout>=2.4,<3"
]
parsers = [
  "arelle-release[esef]>=2.41.4,<2.42",
  "pdfplumber>=0.11.9,<0.12",
  "defusedxml>=0.7.1,<0.8",
  "feedparser>=6.0.11,<7"
]
models = [
  # Keep in step with requirements-models.txt (exact verified pins live there).
  "torch>=2.11,<2.13",
  "safetensors>=0.8,<0.9",
  "huggingface-hub>=1.27,<2",
  "transformers>=5.15,<6",
  "timesfm==3.0.2",
  "toto-2==2.0.0; python_version >= '3.12'",  # toto-2 requires Python 3.12+
  "einops>=0.8,<0.9",
  "gluonts[torch]>=0.17,<0.18",
  "jaxtyping>=0.3,<0.4",
  "dd-unit-scaling>=0.1.0,<0.2",
  "rotary-embedding-torch>=0.9,<0.10",
  "lightning>=2.6.6,<2.7"
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"etf_cockpit.resources" = ["benchmark_reference_registry.json"]
"etf_cockpit.app" = ["assets/icons/*.png", "assets/fonts/*", "assets/background/*", "assets/globe/*", "assets/geo/*"]

[tool.setuptools.data-files]
"configs" = ["configs/ui_acceptance.yaml"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
addopts = "-q -p no:cacheprovider"
markers = [
  "serial: test is unsafe for parallel execution and remains in the authoritative serial lane",
  "xdist_group(name): resource group used only by the report-only xdist pilot"
]
