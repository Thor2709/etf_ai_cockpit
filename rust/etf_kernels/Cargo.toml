[package]
name = "etf_kernels"
version = "0.1.0"
edition = "2021"
publish = false

[lib]
name = "etf_kernels"
crate-type = ["cdylib"]

[profile.release]
opt-level = 3
lto = true
codegen-units = 1

[dependencies]
numpy = "=0.30.0"
pyo3 = { version = "=0.30.1", features = ["extension-module", "abi3-py311"] }
rayon = "=1.12.0"
