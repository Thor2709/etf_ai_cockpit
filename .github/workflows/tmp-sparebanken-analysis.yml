name: Temporary Sparebanken current-source analysis

on:
  push:
    branches:
      - tmp-sparebanken-analysis-20260925

permissions:
  contents: read

jobs:
  analyse:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      ETF_COCKPIT_ROOT: ${{ github.workspace }}
      PYTHONUNBUFFERED: "1"
      PYTHONPATH: ${{ github.workspace }}/src
    steps:
      - name: Checkout exact analysis branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12.10"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install BAT/source dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Apply runtime-only Yahoo compatibility repair
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import yaml

          # Three ordinary configured symbols currently return no Yahoo rows.
          path = Path("configs/universe.yaml")
          payload = yaml.safe_load(path.read_text(encoding="utf-8"))
          dead_yaml = {"JEDI", "SPCX", "RABO"}
          for row in payload.get("etfs", []):
              if str(row.get("id")) in dead_yaml:
                  row["enabled"] = False
          path.write_text(yaml.safe_dump(payload, sort_keys=False, allow_unicode=True), encoding="utf-8")

          # JAEREN and SADG are canonical Sparebanken fallback rows and therefore
          # override universe.yaml. Disable only those two in this disposable
          # runner so a valid partial universe can refresh.
          store = Path("src/etf_cockpit/data/universe_store.py")
          text = store.read_text(encoding="utf-8")
          old = '{"name": name, "symbol": symbol, "yahoo_symbol": ticker, "isin": isin, "analysis_tier": "sparebanken"},'
          new = '{"name": name, "symbol": symbol, "yahoo_symbol": ticker, "isin": isin, "analysis_tier": "sparebanken", "enabled": symbol not in {"JAEREN", "SADG"}},'
          if old not in text:
              raise SystemExit("Sparebanken fallback patch target not found")
          store.write_text(text.replace(old, new, 1), encoding="utf-8")

          # Rebind the settings identity to the runtime-only universe.yaml change.
          from etf_cockpit.application.settings import SettingsControls, _base_bundle, _revision_for
          settings_path = Path("configs/settings.yaml")
          settings_raw = yaml.safe_load(settings_path.read_text(encoding="utf-8")) or {}
          controls = SettingsControls.model_validate(settings_raw.get("controls", {}))
          base = _base_bundle(Path(".").resolve(), controls).model_copy(
              update={"settings_version": int(settings_raw.get("settings_version", 0)), "revision": ""}
          )
          settings_raw["revision"] = _revision_for(base)
          settings_path.write_text(yaml.safe_dump(settings_raw, sort_keys=False, allow_unicode=True), encoding="utf-8")
          print("Runtime-disabled Yahoo rows: JEDI, SPCX, RABO, JAEREN, SADG")
          print("Runtime settings revision:", settings_raw["revision"])
          PY

      - name: Run current source, then add ROMER as candidate
        shell: bash
        run: |
          mkdir -p artifacts/sparebanken
          cat > /tmp/run_sparebanken.py <<'PY'
          from __future__ import annotations
          import json
          import os
          import traceback
          from pathlib import Path
          import pandas as pd

          root = Path(os.environ["ETF_COCKPIT_ROOT"])
          os.chdir(root)

          from etf_cockpit.app.state import AppState
          from etf_cockpit.services import DataService, build_snapshot
          from etf_cockpit.data.trade_candidate_analysis import refresh_candidate_analysis

          targets = {"NONG", "SBNOR", "ROMER"}
          audit = {
              "requested_instruments": sorted(targets),
              "source_commit": os.environ.get("GITHUB_SHA"),
              "base_main_commit": "7029d0075daafd0e66c6419cea2383339c4926ee",
              "workflow": "current BAT/source AppState workflow",
              "runtime_only_disabled_ids": ["JEDI", "SPCX", "RABO", "JAEREN", "SADG"],
              "runtime_repair_reason": "These five current configured Yahoo symbols returned no rows; the unmodified app therefore fail-closed the complete refresh.",
              "steps": {},
          }

          state = AppState.load()
          audit["steps"]["load"] = {"ok": True}

          # 1. Refresh configured universe with NO ROMER candidate present.
          try:
              msg = state.refresh_yfinance_data()
              audit["steps"]["refresh_yfinance_data"] = {"ok": True, "result": str(msg)}
          except Exception as exc:
              audit["steps"]["refresh_yfinance_data"] = {
                  "ok": False, "error": f"{type(exc).__name__}: {exc}", "traceback": traceback.format_exc()
              }

          # 2. Run configured forecasts only, preserving NONG/SBNOR configured peer set.
          try:
              service = DataService(state.snapshot.config)
              request = __import__("etf_cockpit.models.forecast_scores", fromlist=["configured_forecast_request_identity"]).configured_forecast_request_identity(state.snapshot.config)
              msg = service.run_yfinance_forecasts(
                  include_candidates=False,
                  horizons=list(request["requested_horizons"]),
                  live_optional_models=bool(request["live_optional_models"]),
              )
              audit["steps"]["configured_forecasts"] = {"ok": bool(service.last_operation_succeeded), "result": str(msg)}
              state.snapshot = build_snapshot(force_sample=False)
              path = state._write_current_scoreboard()
              audit["steps"]["configured_scoreboard"] = {"ok": True, "path": str(path)}
          except Exception as exc:
              audit["steps"]["configured_forecasts"] = {
                  "ok": False, "error": f"{type(exc).__name__}: {exc}", "traceback": traceback.format_exc()
              }

          # Capture configured NONG/SBNOR before introducing ROMER.
          configured_rows = {}
          scoreboard = root / "data" / "derived" / "scoreboard.json"
          if scoreboard.exists():
              for row in json.loads(scoreboard.read_text(encoding="utf-8")):
                  iid = str(row.get("display_id") or row.get("instrument_id") or "")
                  if iid in {"NONG","SBNOR"}:
                      configured_rows[iid] = row

          configured_features = {}
          latest = getattr(state.snapshot, "latest_features", pd.DataFrame())
          if isinstance(latest, pd.DataFrame) and not latest.empty and "etf_id" in latest:
              for _, row in latest[latest["etf_id"].astype(str).isin({"NONG","SBNOR"})].iterrows():
                  configured_features[str(row["etf_id"])] = {
                      k: (None if pd.isna(v) else v) for k,v in row.to_dict().items()
                  }

          # 3. Add ROMER only now, through the app's candidate/ad-hoc route.
          candidate_dir = root / "data" / "raw" / "trade_candidates"
          candidate_dir.mkdir(parents=True, exist_ok=True)
          candidate_path = candidate_dir / "yahoo_trade_candidates_2026-09-25_sparebanken.csv"
          candidate_path.write_text(
              "instrument_id,name,isin,yahoo_symbol,shares,currency,analysis_tier,data_policy,instrument_type\n"
              "ROMER,Romerike Sparebank,,ROMER.OL,0,NOK,sparebanken,yfinance_only,equity_certificate\n",
              encoding="utf-8",
          )

          # App candidate analysis for ROMER.
          try:
              cand_romer = refresh_candidate_analysis(state.snapshot.config, years=5, candidate_path=candidate_path)
              audit["steps"]["romer_candidate_analysis"] = {"ok": True, "path": str(cand_romer.json_path)}
          except Exception as exc:
              audit["steps"]["romer_candidate_analysis"] = {
                  "ok": False, "error": f"{type(exc).__name__}: {exc}", "traceback": traceback.format_exc()
              }

          # Candidate forecast via the same DataService source workflow.
          try:
              service = DataService(state.snapshot.config)
              msg = service.run_yfinance_forecasts(
                  include_candidates=True,
                  horizons=list(request["requested_horizons"]),
                  live_optional_models=bool(request["live_optional_models"]),
              )
              audit["steps"]["candidate_forecasts"] = {"ok": bool(service.last_operation_succeeded), "result": str(msg)}
              path = state._write_current_scoreboard()
              audit["steps"]["final_scoreboard"] = {"ok": True, "path": str(path)}
          except Exception as exc:
              audit["steps"]["candidate_forecasts"] = {
                  "ok": False, "error": f"{type(exc).__name__}: {exc}", "traceback": traceback.format_exc()
              }

          # 4. Separately run the app's candidate fundamental/technical analysis
          # for all three to expose Yahoo valuation/quality fields on one basis.
          all3 = root / "artifacts" / "sparebanken" / "all3_candidates.csv"
          all3.write_text(
              "instrument_id,name,isin,yahoo_symbol,shares,currency,analysis_tier,data_policy,instrument_type\n"
              "NONG,SpareBank 1 Nord-Norge,NO0006000801,NONG.OL,0,NOK,sparebanken,yfinance_only,equity_certificate\n"
              "SBNOR,Sparebanken Norge,,SBNOR.OL,0,NOK,secondary,yfinance_only,stock\n"
              "ROMER,Romerike Sparebank,,ROMER.OL,0,NOK,sparebanken,yfinance_only,equity_certificate\n",
              encoding="utf-8",
          )
          all3_rows = {}
          try:
              cand_all = refresh_candidate_analysis(state.snapshot.config, years=5, candidate_path=all3)
              for row in json.loads(cand_all.json_path.read_text(encoding="utf-8")):
                  iid = str(row.get("instrument_id") or "")
                  if iid in targets:
                      all3_rows[iid] = row
              audit["steps"]["all3_candidate_fundamentals"] = {"ok": True, "path": str(cand_all.json_path)}
          except Exception as exc:
              audit["steps"]["all3_candidate_fundamentals"] = {
                  "ok": False, "error": f"{type(exc).__name__}: {exc}", "traceback": traceback.format_exc()
              }

          # Final ROMER candidate scoreboard row.
          final_rows = dict(configured_rows)
          if scoreboard.exists():
              for row in json.loads(scoreboard.read_text(encoding="utf-8")):
                  iid = str(row.get("display_id") or row.get("instrument_id") or "")
                  if iid == "ROMER":
                      final_rows[iid] = row

          extract = {
              "source_commit": os.environ.get("GITHUB_SHA"),
              "base_main_commit": audit["base_main_commit"],
              "runtime_only_disabled_ids": audit["runtime_only_disabled_ids"],
              "instruments": final_rows,
              "latest_features": configured_features,
              "candidate_fundamentals": all3_rows,
              "forecast_rows": {},
              "backtest_results": [],
              "files": {},
          }

          for path in sorted((root / "data" / "forecasts").glob("*.csv")):
              try:
                  frame = pd.read_csv(path)
              except Exception:
                  continue
              id_col = next((col for col in ("etf_id","instrument_id") if col in frame.columns), None)
              if id_col is None:
                  continue
              subset = frame[frame[id_col].astype(str).isin(targets)]
              if not subset.empty:
                  extract["forecast_rows"][str(path.relative_to(root))] = [
                      {k: (None if pd.isna(v) else v) for k,v in row.items()}
                      for row in subset.to_dict(orient="records")
                  ]

          bt_path = root / "data" / "backtests" / "backtest_results.csv"
          if bt_path.exists():
              bt = pd.read_csv(bt_path)
              preferred = [
                  "strategy_name","cagr","volatility","sharpe","sortino","max_drawdown","calmar",
                  "turnover","cost_drag","n_walk_forward_periods","trade_count","return_hit_rate",
                  "average_win_return","average_loss_return","payoff_ratio","expected_value_per_period",
                  "probabilistic_sharpe","deflated_sharpe","pbo_probability_backtest_overfitting",
                  "parameter_sensitivity_status","backtest_quality","worst_1d_return","worst_5d_return",
                  "worst_10d_return","worst_12m_return","loss_cluster_max_days","overfitting_warning"
              ]
              cols = [col for col in preferred if col in bt.columns]
              extract["backtest_results"] = [
                  {k: (None if pd.isna(v) else v) for k,v in row.items()}
                  for row in bt[cols].to_dict(orient="records")
              ]

          extract["files"]["scoreboard"] = str(scoreboard.relative_to(root)) if scoreboard.exists() else None
          extract["files"]["forecasts"] = [str(p.relative_to(root)) for p in sorted((root/"data"/"forecasts").glob("*.csv"))]
          extract["files"]["reports"] = [str(p.relative_to(root)) for p in sorted((root/"data"/"reports").glob("yfinance*"))]
          extract["files"]["backtests"] = [str(p.relative_to(root)) for p in sorted((root/"data"/"backtests").glob("*")) if p.is_file()]

          out = root / "artifacts" / "sparebanken"
          (out / "workflow_audit.json").write_text(json.dumps(audit, indent=2, default=str), encoding="utf-8")
          (out / "final_extract.json").write_text(json.dumps(extract, indent=2, default=str), encoding="utf-8")

          score_keys = [
              "current_price","latest_price_date","evidence_score_10","evidence_quality_10","risk_friction_10",
              "final_label","decision","canonical_attractiveness_10","canonical_expected_return_10",
              "canonical_risk_implementation_10","canonical_evidence_confidence_10","canonical_coverage",
              "data_quality_score_10","momentum_score_10","trend_score_10","risk_score_10",
              "relative_strength_score_10","liquidity_cost_score_10","stock_value_score_10",
              "stock_quality_score_10","analyst_revision_score_10","baseline_score_10",
              "timesfm_score_10","toto_score_10","backtest_trust_score_10","backtest_validity",
              "analysis_status","formula_version","reason_short"
          ]
          compact = {
              iid: {k: final_rows.get(iid, {}).get(k) for k in score_keys}
              for iid in sorted(targets)
          }
          fundamental_keys = [
              "latest_date","latest_price","rows","return_1w","return_1m","return_3m","return_6m","return_12m",
              "volatility_20d_ann","volatility_60d_ann","current_drawdown","max_drawdown_12m",
              "distance_from_52w_high","sma50_signal","sma200_signal","median_volume_60d",
              "median_turnover_60d_eur","high_low_spread_proxy_20","market_cap","trailing_pe","forward_pe",
              "price_to_book","earnings_yield","fcf_yield","roe","operating_margin","profit_margin",
              "debt_to_equity","recommendation_mean","value_score_10","quality_score_10",
              "analyst_revision_score_10","fundamental_available","fundamental_missing_fields","fundamental_warnings",
              "technical_score","advisory_status","blocked_by"
          ]
          compact_fundamentals = {
              iid: {k: all3_rows.get(iid, {}).get(k) for k in fundamental_keys}
              for iid in sorted(targets)
          }

          print("===AUDIT==="); print(json.dumps(audit, indent=2, default=str))
          print("===COMPACT_SCORES==="); print(json.dumps(compact, indent=2, default=str))
          print("===CANDIDATE_FUNDAMENTALS==="); print(json.dumps(compact_fundamentals, indent=2, default=str))
          print("===LATEST_FEATURES==="); print(json.dumps(configured_features, indent=2, default=str))
          print("===FORECAST_ROWS==="); print(json.dumps(extract["forecast_rows"], indent=2, default=str))
          print("===BACKTEST_RESULTS==="); print(json.dumps(extract["backtest_results"], indent=2, default=str))
          PY
          set -o pipefail
          python /tmp/run_sparebanken.py 2>&1 | tee artifacts/sparebanken/run.log

      - name: Collect exact app outputs
        if: always()
        shell: bash
        run: |
          mkdir -p artifacts/sparebanken
          cp -a data/derived artifacts/sparebanken/ 2>/dev/null || true
          cp -a data/forecasts artifacts/sparebanken/ 2>/dev/null || true
          cp -a data/backtests artifacts/sparebanken/ 2>/dev/null || true
          cp -a data/reports artifacts/sparebanken/ 2>/dev/null || true
          cp -a data/features artifacts/sparebanken/ 2>/dev/null || true
          cp -a data/clean artifacts/sparebanken/ 2>/dev/null || true
          cp -a data/raw/trade_candidates artifacts/sparebanken/ 2>/dev/null || true
          cp configs/universe.yaml artifacts/sparebanken/runtime_universe.yaml
          git rev-parse HEAD > artifacts/sparebanken/source_commit.txt
          python -m pip freeze > artifacts/sparebanken/pip_freeze.txt

      - name: Upload exact current-source outputs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sparebanken-current-source-${{ github.sha }}
          path: artifacts/sparebanken
          if-no-files-found: error
          retention-days: 7
