name: Control-plane forensic snapshot (temporary)

# One-time diagnostic collection for the owner-requested remediation.
# No programme, issue, branch, release, provider or deployment writes.
# Remove this workflow from the candidate before final acceptance.
on:
  pull_request:
    paths:
      - .github/workflows/control-plane-forensic-snapshot.yml

permissions:
  contents: read
  issues: read
  pull-requests: read
  actions: read

jobs:
  snapshot:
    if: >-
      github.repository == 'Thor2709/etf_ai_cockpit' &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.head.ref == 'codex/control-plane-remediation-20260908'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out the exact diagnostic head without persisted credentials
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Collect Git history and read-only GitHub observations
        shell: bash
        env:
          GH_READ_TOKEN: ${{ github.token }}
          SNAPSHOT_HEAD: ${{ github.event.pull_request.head.sha }}
          SNAPSHOT_BASE: 51bec2b8937f725e9e1c74136249a1d9c7d4851a
          SNAPSHOT_RUN_ID: ${{ github.run_id }}
        run: |
          python - <<'PY'
          import datetime
          import hashlib
          import json
          import os
          import pathlib
          import re
          import subprocess
          import urllib.error
          import urllib.parse
          import urllib.request

          root = pathlib.Path.cwd()
          out = pathlib.Path(os.environ['RUNNER_TEMP']) / 'control-plane-forensics'
          out.mkdir()
          api = 'https://api.github.com/repos/Thor2709/etf_ai_cockpit'
          started = datetime.datetime.now(datetime.timezone.utc).isoformat()
          base = os.environ['SNAPSHOT_BASE']
          head = os.environ['SNAPSHOT_HEAD']
          if not all(re.fullmatch(r'[0-9a-f]{40}', x) for x in (base, head)):
              raise SystemExit('Invalid exact Git identity')

          def git(*args):
              return subprocess.check_output(['git', *args], cwd=root, text=True).strip()

          if git('rev-parse', 'HEAD') != head:
              raise SystemExit('Checkout does not equal diagnostic head')
          git('cat-file', '-e', base + '^{commit}')

          def get(path):
              url = api + '/' + path.lstrip('/')
              request = urllib.request.Request(url, headers={
                  'Authorization': 'Bearer ' + os.environ['GH_READ_TOKEN'],
                  'Accept': 'application/vnd.github+json',
                  'X-GitHub-Api-Version': '2022-11-28',
                  'User-Agent': 'etf-control-plane-read-only-audit',
              }, method='GET')
              with urllib.request.urlopen(request, timeout=45) as response:
                  return json.load(response)

          def pages(path):
              results = []
              separator = '&' if '?' in path else '?'
              for page in range(1, 101):
                  batch = get(path + separator + f'per_page=100&page={page}')
                  if not isinstance(batch, list):
                      raise ValueError('Expected a paginated list: ' + path)
                  results.extend(batch)
                  if len(batch) < 100:
                      return results
              raise ValueError('Pagination safety ceiling reached: ' + path)

          def save(name, value):
              (out / name).write_text(json.dumps(value, indent=2, sort_keys=True) + '\n', encoding='utf-8')

          initial_main = get('branches/main')
          save('main-start.json', initial_main)
          save('branches.json', pages('branches'))
          save('issues-all.json', pages('issues?state=all&sort=created&direction=asc'))
          pulls = pages('pulls?state=open&sort=created&direction=asc')
          save('pulls-open.json', pulls)
          save('pulls-recent-closed.json', get('pulls?state=closed&sort=updated&direction=desc&per_page=100'))
          try:
              save('rulesets.json', get('rulesets?includes_parents=true'))
          except urllib.error.HTTPError as exc:
              save('rulesets-unavailable.json', {'http_status': exc.code, 'claim': 'UNKNOWN'})
          for pr in pulls:
              number = pr['number']
              pr_head = pr['head']['sha']
              prefix = f'pr-{number}'
              save(prefix + '-files.json', pages(f'pulls/{number}/files'))
              save(prefix + '-commits.json', pages(f'pulls/{number}/commits'))
              save(prefix + '-reviews.json', pages(f'pulls/{number}/reviews'))
              save(prefix + '-comments.json', pages(f'issues/{number}/comments'))
              save(prefix + '-status.json', get(f'commits/{pr_head}/status'))
              save(prefix + '-checks.json', get(f'commits/{pr_head}/check-runs?per_page=100'))
              save(prefix + '-runs.json', get(f'actions/runs?head_sha={pr_head}&per_page=100'))
              git('fetch', '--no-tags', 'origin', f'refs/pull/{number}/head:refs/remotes/audit/pr-{number}')
          git('fetch', '--no-tags', 'origin', '+refs/heads/*:refs/remotes/origin/*')
          git('bundle', 'create', str(out / 'repository.bundle'), '--all')
          git('bundle', 'verify', str(out / 'repository.bundle'))
          save('bundle-heads.json', git('bundle', 'list-heads', str(out / 'repository.bundle')).splitlines())
          save('base-tree.json', git('ls-tree', '-r', base).splitlines())
          final_main = get('branches/main')
          final_pulls = pages('pulls?state=open&sort=created&direction=asc')
          save('main-end.json', final_main)
          save('pulls-open-end.json', final_pulls)
          identities_start = {p['number']: p['head']['sha'] for p in pulls}
          identities_end = {p['number']: p['head']['sha'] for p in final_pulls}
          save('snapshot-identity.json', {
              'schema_version': 'control-plane-forensic-observation.v1',
              'repository': 'Thor2709/etf_ai_cockpit',
              'observed_base': base,
              'diagnostic_head': head,
              'run_id': os.environ['SNAPSHOT_RUN_ID'],
              'started_at': started,
              'finished_at': datetime.datetime.now(datetime.timezone.utc).isoformat(),
              'main_stable': initial_main['commit']['sha'] == final_main['commit']['sha'],
              'pr_heads_stable': identities_start == identities_end,
              'apply_authority': False,
              'execution_allowed': False,
              'acceptance_evidence': False,
              'note': 'Read-only observations, not canonical programme state or review acceptance.',
          })
          save('sha256.json', {
              p.name: hashlib.sha256(p.read_bytes()).hexdigest()
              for p in sorted(out.iterdir()) if p.is_file()
          })
          print('Read-only snapshot collected; no acceptance or mutation authority asserted.')
          PY

      - name: Preserve the snapshot in this repository's diagnostic artifacts
        uses: actions/upload-artifact@v4
        with:
          name: control-plane-forensic-snapshot-${{ github.run_id }}
          path: ${{ runner.temp }}/control-plane-forensics/
          if-no-files-found: error
          retention-days: 30
