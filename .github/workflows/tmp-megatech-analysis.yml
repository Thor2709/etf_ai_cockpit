name: Temporary megatech current-source analysis

on:
  push:
    branches:
      - tmp-megatech-analysis-20260926

permissions:
  contents: read

jobs:
  analyse:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      ETF_COCKPIT_ROOT: ${{ github.workspace }}
      PYTHONUNBUFFERED: "1"
      PYTHONPATH: ${{ github.workspace }}/src
    steps:
      - name: Checkout exact analysis branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12.10"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install current source dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Build runtime-only megatech universe
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import yaml

          path = Path("configs/universe.yaml")
          payload = yaml.safe_load(path.read_text(encoding="utf-8")) or {}
          rows = payload.setdefault("etfs", [])

          keep = {"VWCE", "MSFT"}
          for row in rows:
              iid = str(row.get("id") or "")
              row["enabled"] = iid in keep

          additions = [
              {
                  "id":"GOOGL","name":"Alphabet Inc Class A","isin":"needs_verification",
                  "ticker":"GOOGL","provider_symbol":"GOOGL","exchange":"NASDAQ","currency":"USD",
                  "asset_class":"equity","instrument_type":"stock","analysis_tier":"secondary",
                  "data_policy":"yfinance_only","region":"United States","sector":"Technology",
                  "theme":"Internet and cloud","role":"watchlist","isin_status":"needs_verification","enabled":True,
              },
              {
                  "id":"IBM","name":"International Business Machines Corp","isin":"needs_verification",
                  "ticker":"IBM","provider_symbol":"IBM","exchange":"NYSE","currency":"USD",
                  "asset_class":"equity","instrument_type":"stock","analysis_tier":"secondary",
                  "data_policy":"yfinance_only","region":"United States","sector":"Technology",
                  "theme":"Enterprise technology","role":"watchlist","isin_status":"needs_verification","enabled":True,
              },
              {
                  "id":"AAPL","name":"Apple Inc","isin":"needs_verification",
                  "ticker":"AAPL","provider_symbol":"AAPL","exchange":"NASDAQ","currency":"USD",
                  "asset_class":"equity","instrument_type":"stock","analysis_tier":"secondary",
                  "data_policy":"yfinance_only","region":"United States","sector":"Technology",
                  "theme":"Consumer technology","role":"watchlist","isin_status":"needs_verification","enabled":True,
              },
              {
                  "id":"META","name":"Meta Platforms Inc Class A","isin":"needs_verification",
                  "ticker":"META","provider_symbol":"META","exchange":"NASDAQ","currency":"USD",
                  "asset_class":"equity","instrument_type":"stock","analysis_tier":"secondary",
                  "data_policy":"yfinance_only","region":"United States","sector":"Communication Services",
                  "theme":"Digital platforms and AI","role":"watchlist","isin_status":"needs_verification","enabled":True,
              },
          ]

          by_id = {str(row.get("id") or ""): row for row in rows}
          for add in additions:
              if add["id"] in by_id:
                  by_id[add["id"]].update(add)
              else:
                  rows.append(add)

          path.write_text(yaml.safe_dump(payload, sort_keys=False, allow_unicode=True), encoding="utf-8")

          # Disable the built-in Sparebanken fallback in this disposable run so
          # the live peer universe is exactly VWCE + the five requested stocks.
          store = Path("src/etf_cockpit/data/universe_store.py")
          text = store.read_text(encoding="utf-8")
          old = '{"name": name, "symbol": symbol, "yahoo_symbol": ticker, "isin": isin, "analysis_tier": "sparebanken"},'
          new = '{"name": name, "symbol": symbol, "yahoo_symbol": ticker, "isin": isin, "analysis_tier": "sparebanken", "enabled": False},'
          if old in text:
              text = text.replace(old, new, 1)
              store.write_text(text, encoding="utf-8")

          # Rebind settings identity to the disposable companion universe.
          from etf_cockpit.application.settings import SettingsControls, _base_bundle, _revision_for
          settings_path = Path("configs/settings.yaml")
          settings_raw = yaml.safe_load(settings_path.read_text(encoding="utf-8")) or {}
          controls = SettingsControls.model_validate(settings_raw.get("controls", {}))
          base = _base_bundle(Path(".").resolve(), controls).model_copy(
              update={"settings_version": int(settings_raw.get("settings_version", 0)), "revision": ""}
          )
          settings_raw["revision"] = _revision_for(base)
          settings_path.write_text(yaml.safe_dump(settings_raw, sort_keys=False, allow_unicode=True), encoding="utf-8")

          print("Runtime universe: VWCE, MSFT, GOOGL, IBM, AAPL, META")
          PY

      - name: Run validated live analysis
        shell: bash
        run: |
          mkdir -p artifacts/megatech
          cat > /tmp/run_live.py <<'PY'
          from __future__ import annotations
          import json, os
          from datetime import date
          from pathlib import Path
          import pandas as pd

          root = Path(os.environ["ETF_COCKPIT_ROOT"])
          os.chdir(root)

          from etf_cockpit.app.state import AppState
          from etf_cockpit.services import DataService, build_snapshot
          from etf_cockpit.models.forecast_scores import configured_forecast_request_identity
          from etf_cockpit.data.yfinance_provider import YFinanceProvider
          from etf_cockpit.data.validation import validate_prices
          from etf_cockpit.data.duckdb_store import write_prices
          from etf_cockpit.data.trade_candidate_analysis import refresh_candidate_analysis

          targets = {"MSFT","GOOGL","IBM","AAPL","META"}
          out = root / "artifacts" / "megatech"
          audit = {
              "base_main_commit":"d29a3093bd6cdb8f26ec2d08bbce1332808693cb",
              "workflow_commit":os.environ.get("GITHUB_SHA"),
              "runtime_universe":["VWCE","MSFT","GOOGL","IBM","AAPL","META"],
              "sanitisation_rule":"drop only rows violating current validate_prices OHLC inequalities; abort if any blocker remains",
              "steps":{},
          }

          state = AppState.load()
          config = state.snapshot.config
          audit["steps"]["load"] = {"ok": True}

          end = date.today()
          start = end.replace(year=end.year - 5)
          result = YFinanceProvider.from_config(config).fetch_prices([], start, end)
          if not result.ok or result.data is None:
              raise RuntimeError(str(result.message))

          raw = result.data.copy()
          raw["date"] = pd.to_datetime(raw["date"])
          bad = (
              (raw["open"] <= 0)
              | (raw["close"] <= 0)
              | (raw["high"] < raw["low"])
              | (raw["high"] < raw[["open","close"]].max(axis=1))
              | (raw["low"] > raw[["open","close"]].min(axis=1))
          )
          dropped = raw.loc[bad, ["date","etf_id","open","high","low","close","adjusted_close","provider_symbol"]].copy()
          clean = raw.loc[~bad].copy()
          clean["date"] = clean["date"].dt.date
          dropped["date"] = dropped["date"].dt.date

          report = validate_prices(clean, as_of_date=end)
          blockers = [{"etf_id":i.etf_id,"code":i.code,"message":i.message} for i in report.issues if i.severity=="block"]
          audit["steps"]["live_yahoo_fetch"] = {
              "ok": True,
              "raw_rows": int(len(raw)),
              "clean_rows": int(len(clean)),
              "dropped_ohlc_rows": int(len(dropped)),
              "dropped_by_instrument": {str(k):int(v) for k,v in dropped.groupby("etf_id").size().items()},
              "remaining_blockers": blockers,
          }
          if blockers:
              (out/"workflow_audit.json").write_text(json.dumps(audit,indent=2,default=str),encoding="utf-8")
              print("===AUDIT==="); print(json.dumps(audit,indent=2,default=str))
              raise RuntimeError("Sanitised live Yahoo prices still fail current app validation")

          write_prices(clean)
          state.snapshot = build_snapshot(force_sample=False)
          audit["steps"]["live_snapshot"] = {"ok":True,"as_of":str(state.snapshot.data_report.as_of_date)}

          service = DataService(state.snapshot.config)
          request = configured_forecast_request_identity(state.snapshot.config)
          msg = service.run_yfinance_forecasts(
              include_candidates=False,
              horizons=list(request["requested_horizons"]),
              live_optional_models=bool(request["live_optional_models"]),
              use_cache=False,
          )
          audit["steps"]["forecasts"] = {"ok":bool(service.last_operation_succeeded),"result":str(msg)}

          state.snapshot = build_snapshot(force_sample=False)
          score_path = state._write_current_scoreboard()
          audit["steps"]["scoreboard"] = {"ok":True,"path":str(score_path)}

          # Run the app's Yahoo fundamentals/technical analyser on the same five stocks.
          candidates = Path("/tmp/megatech_candidates.csv")
          candidates.write_text(
              "instrument_id,name,isin,yahoo_symbol,shares,currency,analysis_tier,data_policy,instrument_type\n"
              "MSFT,Microsoft Corp,,MSFT,0,USD,secondary,yfinance_only,stock\n"
              "GOOGL,Alphabet Inc Class A,,GOOGL,0,USD,secondary,yfinance_only,stock\n"
              "IBM,International Business Machines Corp,,IBM,0,USD,secondary,yfinance_only,stock\n"
              "AAPL,Apple Inc,,AAPL,0,USD,secondary,yfinance_only,stock\n"
              "META,Meta Platforms Inc Class A,,META,0,USD,secondary,yfinance_only,stock\n",
              encoding="utf-8"
          )
          cand = refresh_candidate_analysis(state.snapshot.config, years=5, candidate_path=candidates)
          fundamentals = {
              str(x.get("instrument_id")):x
              for x in json.loads(cand.json_path.read_text(encoding="utf-8"))
              if str(x.get("instrument_id")) in targets
          }

          scoreboard = json.loads((root/"data"/"derived"/"scoreboard.json").read_text(encoding="utf-8"))
          instruments = {
              str(x.get("display_id") or x.get("instrument_id")): x
              for x in scoreboard
              if str(x.get("display_id") or x.get("instrument_id")) in targets
          }

          latest_features = {}
          lf = getattr(state.snapshot, "latest_features", pd.DataFrame())
          if isinstance(lf, pd.DataFrame) and not lf.empty and "etf_id" in lf.columns:
              for _, row in lf[lf["etf_id"].astype(str).isin(targets)].iterrows():
                  latest_features[str(row["etf_id"])] = {
                      k:(None if pd.isna(v) else v) for k,v in row.to_dict().items()
                  }

          forecasts = {}
          for p in sorted((root/"data"/"forecasts").glob("*.csv")):
              frame = pd.read_csv(p)
              if "model_name" not in frame.columns or "etf_id" not in frame.columns:
                  continue
              sub = frame[frame["etf_id"].astype(str).isin(targets)]
              if not sub.empty:
                  forecasts[str(p.relative_to(root))] = [
                      {k:(None if pd.isna(v) else v) for k,v in row.items()}
                      for row in sub.to_dict(orient="records")
                  ]

          backtests = []
          bp = root/"data"/"backtests"/"backtest_results.csv"
          if bp.exists():
              frame = pd.read_csv(bp)
              cols = [c for c in [
                  "strategy_name","cagr","volatility","sharpe","sortino","max_drawdown","calmar",
                  "turnover","cost_drag","n_walk_forward_periods","trade_count","return_hit_rate",
                  "average_win_return","average_loss_return","payoff_ratio","expected_value_per_period",
                  "probabilistic_sharpe","deflated_sharpe","pbo_probability_backtest_overfitting",
                  "parameter_sensitivity_status","backtest_quality","worst_1d_return","worst_5d_return",
                  "worst_10d_return","worst_12m_return","loss_cluster_max_days","overfitting_warning"
              ] if c in frame.columns]
              backtests = [
                  {k:(None if pd.isna(v) else v) for k,v in row.items()}
                  for row in frame[cols].to_dict(orient="records")
              ]

          proof = {}
          for iid in sorted(targets):
              rows = clean[clean["etf_id"].astype(str)==iid].sort_values("date")
              if not rows.empty:
                  last = rows.iloc[-1]
                  proof[iid] = {
                      "rows":int(len(rows)),"date":str(last["date"]),
                      "close":float(last["close"]),"adjusted_close":float(last["adjusted_close"]),
                      "provider_symbol":str(last.get("provider_symbol","")),"source":str(last.get("source",""))
                  }

          extract = {
              "audit":audit,
              "dropped_ohlc_rows":dropped.to_dict(orient="records"),
              "live_price_proof":proof,
              "instruments":instruments,
              "fundamentals":fundamentals,
              "latest_features":latest_features,
              "forecasts":forecasts,
              "backtests":backtests,
          }
          (out/"workflow_audit.json").write_text(json.dumps(audit,indent=2,default=str),encoding="utf-8")
          (out/"final_extract.json").write_text(json.dumps(extract,indent=2,default=str),encoding="utf-8")
          dropped.to_csv(out/"dropped_invalid_ohlc_rows.csv",index=False)

          score_keys = [
              "current_price","latest_price_date","evidence_score_10","evidence_quality_10","risk_friction_10",
              "final_label","decision","canonical_attractiveness_10","canonical_expected_return_10",
              "canonical_risk_implementation_10","canonical_evidence_confidence_10","canonical_coverage",
              "data_quality_score_10","momentum_score_10","trend_score_10","risk_score_10",
              "relative_strength_score_10","liquidity_cost_score_10","stock_value_score_10",
              "stock_quality_score_10","analyst_revision_score_10","baseline_score_10",
              "timesfm_score_10","toto_score_10","backtest_trust_score_10","backtest_validity",
              "analysis_status","formula_version","reason_short"
          ]
          compact = {iid:{k:instruments.get(iid,{}).get(k) for k in score_keys} for iid in sorted(targets)}
          fkeys = [
              "latest_date","latest_price","rows","return_1w","return_1m","return_3m","return_6m","return_12m",
              "volatility_20d_ann","volatility_60d_ann","current_drawdown","max_drawdown_12m",
              "distance_from_52w_high","sma50_signal","sma200_signal","median_volume_60d",
              "median_turnover_60d_eur","high_low_spread_proxy_20","market_cap","trailing_pe","forward_pe",
              "price_to_book","earnings_yield","fcf_yield","roe","operating_margin","profit_margin",
              "debt_to_equity","recommendation_mean","value_score_10","quality_score_10",
              "analyst_revision_score_10","fundamental_available","fundamental_missing_fields",
              "technical_score","advisory_status","blocked_by"
          ]
          compact_f = {iid:{k:fundamentals.get(iid,{}).get(k) for k in fkeys} for iid in sorted(targets)}

          print("===AUDIT==="); print(json.dumps(audit,indent=2,default=str))
          print("===LIVE_PRICE_PROOF==="); print(json.dumps(proof,indent=2,default=str))
          print("===COMPACT_SCORES==="); print(json.dumps(compact,indent=2,default=str))
          print("===FUNDAMENTALS==="); print(json.dumps(compact_f,indent=2,default=str))
          print("===LATEST_FEATURES==="); print(json.dumps(latest_features,indent=2,default=str))
          print("===FORECASTS==="); print(json.dumps(forecasts,indent=2,default=str))
          print("===BACKTESTS==="); print(json.dumps(backtests,indent=2,default=str))
          PY
          set -o pipefail
          python /tmp/run_live.py 2>&1 | tee artifacts/megatech/run.log

      - name: Collect exact outputs
        if: always()
        shell: bash
        run: |
          mkdir -p artifacts/megatech
          cp -a data/derived artifacts/megatech/ 2>/dev/null || true
          cp -a data/forecasts artifacts/megatech/ 2>/dev/null || true
          cp -a data/backtests artifacts/megatech/ 2>/dev/null || true
          cp -a data/reports artifacts/megatech/ 2>/dev/null || true
          cp -a data/features artifacts/megatech/ 2>/dev/null || true
          cp -a data/validated artifacts/megatech/ 2>/dev/null || true
          cp configs/universe.yaml artifacts/megatech/runtime_universe.yaml
          git rev-parse HEAD > artifacts/megatech/source_commit.txt
          python -m pip freeze > artifacts/megatech/pip_freeze.txt

      - name: Upload exact outputs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: megatech-live-sanitised-${{ github.sha }}
          path: artifacts/megatech
          if-no-files-found: error
          retention-days: 7
