name: Programme status completion

on:
  push:
    branches: [main]
    paths:
      - .github/issue-transitions/github-mutation-authority.jsonl

permissions:
  actions: read
  checks: read
  contents: read
  id-token: write
  issues: write

concurrency:
  group: github-mutations-${{ github.repository }}
  cancel-in-progress: false
  queue: max

jobs:
  apply-reviewed-status:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
      - name: Set up pinned Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12.10"
      - name: Install locked mutation runtime
        shell: bash
        run: |
          python -m pip install \
            --require-hashes \
            --only-binary=:all: \
            --requirement requirements-github-mutation-runtime.txt
          python - <<'PY'
          import importlib.metadata
          import platform

          assert platform.python_version() == "3.12.10"
          expected = {
              "cffi": "2.0.0",
              "cryptography": "49.0.0",
              "pycparser": "2.23",
          }
          assert {
              distribution: importlib.metadata.version(distribution)
              for distribution in expected
          } == expected
          import cffi  # noqa: F401
          import cryptography  # noqa: F401
          import pycparser  # noqa: F401
          PY
      - name: Guard and apply reviewed status completion
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git fetch --no-tags origin main
          python -m scripts.apply_reviewed_status_completion \
            --root . \
            --candidate .github/issue-transitions/post-merge-control-candidate.json \
            --evidence-out artifacts/programme-status-completion/evidence.json \
            --apply
      - name: Upload status-completion evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: programme-status-completion-${{ github.sha }}
          path: artifacts/programme-status-completion/evidence.json
          if-no-files-found: error
