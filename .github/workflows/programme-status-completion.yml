name: Programme status completion

on:
  push:
    branches: [main]
    paths:
      - .github/issue-transitions/github-mutation-authority.jsonl

permissions:
  actions: read
  checks: read
  contents: read
  id-token: write
  issues: write

concurrency:
  group: github-mutations-${{ github.repository }}
  cancel-in-progress: false
  queue: max

jobs:
  apply-reviewed-status:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Set up pinned Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12.10"
      - name: Install locked mutation runtime
        shell: bash
        run: |
          mapfile -t cryptography_lock < <(grep -E '^cryptography==[0-9]+(\.[0-9]+)*$' requirements-release.txt)
          test "${#cryptography_lock[@]}" -eq 1
          python -m pip install "${cryptography_lock[0]}"
          python - <<'PY'
          import importlib.metadata
          import platform

          assert platform.python_version() == "3.12.10"
          lock = next(
              line.strip()
              for line in open("requirements-release.txt", encoding="utf-8")
              if line.startswith("cryptography==")
          )
          assert lock == f"cryptography=={importlib.metadata.version('cryptography')}"
          import cryptography  # noqa: F401
          PY
      - name: Guard and apply reviewed status completion
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git fetch --no-tags origin main
          python -m scripts.apply_reviewed_status_completion \
            --root . \
            --candidate .github/issue-transitions/post-merge-control-candidate.json \
            --evidence-out artifacts/programme-status-completion/evidence.json \
            --apply
      - name: Upload status-completion evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: programme-status-completion-${{ github.sha }}
          path: artifacts/programme-status-completion/evidence.json
          if-no-files-found: error
