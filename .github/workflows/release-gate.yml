name: Release gate

# This workflow produces reviewable evidence only. It cannot close issues,
# mutate release aliases, publish releases, or change protected state.
on:
  pull_request:
  repository_dispatch:
    types:
      - parallel-pilot-drift
      - parallel-pilot-full
  schedule:
    - cron: "17 3 * * 1"

permissions:
  contents: read
  issues: read

concurrency:
  group: release-gate-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  classifier:
    runs-on: ubuntu-latest
    outputs:
      tier: ${{ steps.classify.outputs.tier }}
      package_gate_required: ${{ steps.classify.outputs.package_gate_required }}
      base_sha: ${{ steps.classify.outputs.base_sha }}
      head_sha: ${{ steps.classify.outputs.head_sha }}
      base_repository: ${{ steps.classify.outputs.base_repository }}
      head_repository: ${{ steps.classify.outputs.head_repository }}
      parallel_pilot_required: ${{ steps.classify.outputs.parallel_pilot_required }}
      parallel_pilot_repetitions: ${{ steps.classify.outputs.parallel_pilot_repetitions }}
      parallel_pilot_reason: ${{ steps.classify.outputs.parallel_pilot_reason }}
    steps:
      - name: Check out source
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Classify validation tier
        id: classify
        shell: bash
        env:
          PR_BASE_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || '' }}
          HEAD_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
          BASE_REPOSITORY: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.repo.full_name || github.repository }}
          HEAD_REPOSITORY: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name || github.repository }}
          PILOT_TRIGGER: ${{ github.event_name == 'repository_dispatch' && github.event.action == 'parallel-pilot-full' && 'manual-full' || github.event_name == 'repository_dispatch' && 'manual' || github.event_name == 'schedule' && 'scheduled' || '' }}
        run: |
          base="$PR_BASE_SHA"
          if [[ -z "$base" ]]; then base="$(git rev-parse origin/main)"; fi
          if [[ ! "$base" =~ ^[0-9a-f]{40}$ ]] || [[ "$base" == "0000000000000000000000000000000000000000" ]]; then
            echo "Missing exact validation base" >&2
            exit 1
          fi
          export RESOLVED_BASE_SHA="$base"
          arguments=(
            --root .
            --base "$base"
            --head "$HEAD_SHA"
            --main-ref origin/main
            --output artifacts/validation/classifier.json
          )
          if [[ -n "$PILOT_TRIGGER" ]]; then arguments+=(--pilot-trigger "$PILOT_TRIGGER"); fi
          reuse_evidence=".github/issue-transitions/reuse-evidence.json"
          if [[ -f "$reuse_evidence" ]]; then
            arguments+=(--reuse-evidence "$reuse_evidence")
          fi
          python scripts/classify_validation.py "${arguments[@]}"
          python - <<'PY'
          import json
          import os
          from pathlib import Path

          report = json.loads(Path("artifacts/validation/classifier.json").read_text(encoding="utf-8"))
          with Path(os.environ["GITHUB_OUTPUT"]).open("a", encoding="utf-8") as output:
              output.write(f"tier={report['tier']}\n")
              output.write(f"package_gate_required={str(report['package_gate_required']).lower()}\n")
              output.write(f"base_sha={os.environ['RESOLVED_BASE_SHA']}\n")
              output.write(f"head_sha={os.environ['HEAD_SHA']}\n")
              output.write(f"base_repository={os.environ['BASE_REPOSITORY']}\n")
              output.write(f"head_repository={os.environ['HEAD_REPOSITORY']}\n")
              output.write(f"parallel_pilot_required={str(report['parallel_pilot_required']).lower()}\n")
              output.write(f"parallel_pilot_repetitions={report['parallel_pilot_repetitions']}\n")
              output.write(f"parallel_pilot_reason={report['parallel_pilot_reason']}\n")
          PY

      - name: Upload classifier report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: validation-classifier-${{ github.sha }}
          path: artifacts/validation/classifier.json
          if-no-files-found: error

  preflight:
    needs: classifier
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      ETF_COCKPIT_VALIDATION_BASE_SHA: ${{ needs.classifier.outputs.base_sha }}
      ETF_COCKPIT_VALIDATION_HEAD_SHA: ${{ needs.classifier.outputs.head_sha }}
    steps:
      - name: Validate trusted pull request identities
        shell: bash
        run: |
          for identity in "$ETF_COCKPIT_VALIDATION_BASE_SHA" "$ETF_COCKPIT_VALIDATION_HEAD_SHA"; do
            if [[ ! "$identity" =~ ^[0-9a-f]{40}$ ]] || [[ "$identity" == "0000000000000000000000000000000000000000" ]]; then
              echo "Invalid trusted pull request identity" >&2
              exit 1
            fi
          done

      - name: Check out reviewed GitHub mutation authority head
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          repository: ${{ needs.classifier.outputs.head_repository }}
          ref: ${{ needs.classifier.outputs.head_sha }}
          path: .validation-head
          fetch-depth: 0
          persist-credentials: false

      - name: Check out trusted pull request base
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          repository: ${{ needs.classifier.outputs.base_repository }}
          ref: ${{ needs.classifier.outputs.base_sha }}
          path: .validation-base
          fetch-depth: 1
          persist-credentials: false

      - name: Detect and couple GitHub mutation authority changes
        id: github_authority
        working-directory: .validation-head
        shell: bash
        run: |
          checked_head="$(git rev-parse HEAD)"
          if [[ "$checked_head" != "$ETF_COCKPIT_VALIDATION_HEAD_SHA" ]]; then
            echo "Exact-head validation checkout mismatch: expected $ETF_COCKPIT_VALIDATION_HEAD_SHA, got $checked_head" >&2
            exit 1
          fi
          if ! git cat-file -e "$ETF_COCKPIT_VALIDATION_BASE_SHA^{commit}"; then
            git fetch --no-tags --depth=1 ../.validation-base "$ETF_COCKPIT_VALIDATION_BASE_SHA"
          fi
          if ! git cat-file -e "$ETF_COCKPIT_VALIDATION_BASE_SHA^{commit}"; then
            echo "Trusted pull request base is unavailable in the exact-head checkout" >&2
            exit 1
          fi
          candidate=".github/issue-transitions/post-merge-control-candidate.json"
          ledger=".github/issue-transitions/github-mutation-authority.jsonl"
          candidate_changed=false
          ledger_changed=false
          git diff --quiet "$ETF_COCKPIT_VALIDATION_BASE_SHA" "$ETF_COCKPIT_VALIDATION_HEAD_SHA" -- "$candidate" || candidate_changed=true
          git diff --quiet "$ETF_COCKPIT_VALIDATION_BASE_SHA" "$ETF_COCKPIT_VALIDATION_HEAD_SHA" -- "$ledger" || ledger_changed=true
          if [[ "$candidate_changed" == "true" && "$ledger_changed" != "true" ]]; then
            echo "A status candidate change requires one coupled ledger append" >&2
            exit 1
          fi
          echo "changed=$ledger_changed" >> "$GITHUB_OUTPUT"

      - name: Set up pinned authority Python
        if: steps.github_authority.outputs.changed == 'true'
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12.10"

      - name: Install locked mutation runtime
        if: steps.github_authority.outputs.changed == 'true'
        working-directory: .validation-head
        run: |
          python -m pip install \
            --require-hashes \
            --only-binary=:all: \
            --requirement requirements-github-mutation-runtime.txt

      - name: Prepare fresh status-completion evidence target
        if: steps.github_authority.outputs.changed == 'true'
        id: status_evidence
        shell: bash
        run: |
          evidence_dir="$(mktemp -d "$RUNNER_TEMP/status-completion.XXXXXX")"
          runner_temp_resolved="$(realpath "$RUNNER_TEMP")"
          evidence_dir_resolved="$(realpath "$evidence_dir")"
          if [[ -L "$evidence_dir" ]] || [[ "$(dirname "$evidence_dir_resolved")" != "$runner_temp_resolved" ]]; then
            echo "Evidence directory escaped the runner temporary directory" >&2
            exit 1
          fi
          if [[ -n "$(find "$evidence_dir" -mindepth 1 -maxdepth 1 -print -quit)" ]]; then
            echo "Evidence directory was not initially empty" >&2
            exit 1
          fi
          echo "dir=$evidence_dir_resolved" >> "$GITHUB_OUTPUT"
          echo "file=$evidence_dir_resolved/status-completion-candidate.json" >> "$GITHUB_OUTPUT"

      - name: Validate reviewed GitHub mutation authority
        if: steps.github_authority.outputs.changed == 'true'
        working-directory: .validation-head
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          STATUS_COMPLETION_EVIDENCE: ${{ steps.status_evidence.outputs.file }}
        run: |
          checked_head="$(git rev-parse HEAD)"
          if [[ "$checked_head" != "$ETF_COCKPIT_VALIDATION_HEAD_SHA" ]]; then
            echo "Exact-head validation checkout mismatch: expected $ETF_COCKPIT_VALIDATION_HEAD_SHA, got $checked_head" >&2
            exit 1
          fi
          python -m scripts.apply_reviewed_status_completion \
            --root . \
            --candidate .github/issue-transitions/post-merge-control-candidate.json \
            --expected-parent "$ETF_COCKPIT_VALIDATION_BASE_SHA" \
            --expected-head "$ETF_COCKPIT_VALIDATION_HEAD_SHA" \
            --evidence-out "$STATUS_COMPLETION_EVIDENCE"

      - name: Verify fresh status-completion evidence
        if: steps.github_authority.outputs.changed == 'true'
        id: status_evidence_verified
        shell: bash
        env:
          STATUS_COMPLETION_EVIDENCE_DIR: ${{ steps.status_evidence.outputs.dir }}
          STATUS_COMPLETION_EVIDENCE: ${{ steps.status_evidence.outputs.file }}
        run: |
          if [[ ! -f "$STATUS_COMPLETION_EVIDENCE" ]] || [[ -L "$STATUS_COMPLETION_EVIDENCE" ]]; then
            echo "Evidence is not a regular non-symlink file" >&2
            exit 1
          fi
          if [[ "$(stat -c '%h' "$STATUS_COMPLETION_EVIDENCE")" != "1" ]] || [[ "$(stat -c '%u' "$STATUS_COMPLETION_EVIDENCE")" != "$(id -u)" ]]; then
            echo "Evidence file ownership or link count is invalid" >&2
            exit 1
          fi
          if [[ "$(realpath "$(dirname "$STATUS_COMPLETION_EVIDENCE")")" != "$STATUS_COMPLETION_EVIDENCE_DIR" ]]; then
            echo "Evidence file escaped its prepared directory" >&2
            exit 1
          fi
          python -I -S - "$STATUS_COMPLETION_EVIDENCE" "$ETF_COCKPIT_VALIDATION_BASE_SHA" "$ETF_COCKPIT_VALIDATION_HEAD_SHA" <<'PY'
          import json
          import pathlib
          import sys

          evidence = json.loads(pathlib.Path(sys.argv[1]).read_text(encoding="utf-8"))
          assert evidence["schema_version"] == "etf-ai-cockpit.status-completion-evidence/1.0"
          assert evidence["expected_parent_sha"] == sys.argv[2]
          assert evidence["expected_head_sha"] == sys.argv[3]
          PY
          echo "ready=true" >> "$GITHUB_OUTPUT"

      - name: Upload status-completion candidate evidence
        if: steps.status_evidence_verified.outputs.ready == 'true'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: validation-status-completion-candidate-${{ github.sha }}
          path: ${{ steps.status_evidence.outputs.file }}
          if-no-files-found: error

      - name: Check out source
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up pinned Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12.10"
          cache: pip
          cache-dependency-path: requirements-release.txt

      - name: Install validation environment
        run: |
          python -m pip install --upgrade pip
          python -m pip install --requirement requirements-release.txt

      - name: Evidence and control preflight
        if: needs.classifier.outputs.tier == 'E'
        run: |
          python scripts/generate_programme.py --root . --check
          git diff --check "$ETF_COCKPIT_VALIDATION_BASE_SHA" "$ETF_COCKPIT_VALIDATION_HEAD_SHA" --

      - name: Product and protected preflight
        if: needs.classifier.outputs.tier != 'E'
        run: |
          python scripts/generate_programme.py --root . --check
          python scripts/validate_app.py --root . --changed
          python -m pytest -q tests/test_button_contracts.py tests/test_architecture_boundaries.py
          # Legacy findings outside the protected validation surface remain
          # tracked separately; do not turn them into an unrelated red baseline.
          python -m ruff check scripts/classify_validation.py scripts/generate_programme.py scripts/validation_summary.py scripts/release_gate.py scripts/validate_app.py scripts/github_mutation_gateway.py scripts/apply_reviewed_status_completion.py scripts/sync_github_issues.py scripts/prepare_github_mutation_authority.py src/etf_cockpit/data/health.py
          python -m mypy --ignore-missing-imports --disable-error-code=import-untyped --follow-imports=skip scripts/classify_validation.py scripts/generate_programme.py scripts/validation_summary.py scripts/github_mutation_gateway.py scripts/apply_reviewed_status_completion.py scripts/sync_github_issues.py scripts/prepare_github_mutation_authority.py
          python -m compileall -q scripts/github_mutation_gateway.py scripts/apply_reviewed_status_completion.py scripts/sync_github_issues.py scripts/prepare_github_mutation_authority.py
          python scripts/smoke_app.py --mode offline --timeout 30
          git diff --check "$ETF_COCKPIT_VALIDATION_BASE_SHA" "$ETF_COCKPIT_VALIDATION_HEAD_SHA" --

      - name: Upload preflight evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: validation-preflight-${{ github.sha }}
          path: |
            artifacts/validation
          if-no-files-found: warn

  supply-chain:
    needs: classifier
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up pinned Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12.10"
          cache: pip
          cache-dependency-path: requirements-release.txt

      - name: Install release tools
        run: |
          python -m pip install --upgrade pip
          python -m pip install --requirement requirements-release.txt

      - name: Run deterministic supply-chain scan
        run: python scripts/supply_chain_scan.py --root . --output artifacts/supply-chain/github-${{ github.sha }}

      - name: Upload supply-chain evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: supply-chain-${{ github.sha }}
          path: artifacts/supply-chain/github-${{ github.sha }}
          if-no-files-found: error

  release-gate:
    needs: [classifier, preflight, supply-chain]
    if: github.event_name == 'pull_request' && needs.classifier.outputs.package_gate_required == 'true'
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: windows
            runner: windows-latest
          - platform: linux
            runner: ubuntu-latest
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 50
    steps:
      - name: Check out source
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Pin reviewed canonical generation base
        shell: bash
        env:
          REVIEWED_BASE_SHA: ${{ needs.classifier.outputs.base_sha }}
          REVIEWED_BASE_REF: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.ref || 'main' }}
        run: |
          if [[ "$REVIEWED_BASE_REF" != "main" ]]; then
            echo "Release-gate control evidence must target main, not $REVIEWED_BASE_REF" >&2
            exit 1
          fi
          if [[ ! "$REVIEWED_BASE_SHA" =~ ^[0-9a-f]{40}$ ]]; then
            echo "Invalid reviewed generation-base SHA: $REVIEWED_BASE_SHA" >&2
            exit 1
          fi
          if ! git cat-file -e "${REVIEWED_BASE_SHA}^{commit}" 2>/dev/null; then
            git fetch --no-tags origin "$REVIEWED_BASE_SHA"
          fi
          git update-ref refs/remotes/origin/main "$REVIEWED_BASE_SHA"
          test "$(git rev-parse origin/main)" = "$REVIEWED_BASE_SHA"

      - name: Set up pinned Python
        id: setup-python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12.10"
          cache: pip
          cache-dependency-path: |
            requirements-release.txt
            requirements-release-parsers.txt

      - name: Configure isolated user profile
        shell: bash
        run: |
          profile="${RUNNER_TEMP}/etf-cockpit-profile-${{ matrix.platform }}"
          mkdir -p "$profile/config" "$profile/cache" "$profile/data"
          {
            echo "HOME=$profile"
            echo "USERPROFILE=$profile"
            echo "APPDATA=$profile/config"
            echo "LOCALAPPDATA=$profile/data"
            echo "XDG_CONFIG_HOME=$profile/config"
            echo "XDG_CACHE_HOME=$profile/cache"
            echo "PIP_CACHE_DIR=$profile/cache/pip"
          } >> "$GITHUB_ENV"

      - name: Install pinned release environment
        shell: bash
        run: |
          python -m pip install --upgrade pip
          python -m pip install --requirement requirements-release.txt
          python -m pip install --requirement requirements-release-parsers.txt

      - name: Verify protected environment
        shell: bash
        env:
          ETF_COCKPIT_SETUP_PYTHON_CACHE_HIT: ${{ steps.setup-python.outputs.cache-hit }}
        run: python scripts/release_gate.py --root . --verify-environment

      - name: Run lint and typing gates
        shell: bash
        run: |
          python -m ruff check scripts/release_gate.py scripts/profile_parallel_pytest.py scripts/aggregate_parallel_pilot.py scripts/validate_app.py scripts/classify_validation.py scripts/generate_programme.py scripts/validation_summary.py scripts/github_mutation_gateway.py scripts/apply_reviewed_status_completion.py scripts/sync_github_issues.py scripts/prepare_github_mutation_authority.py src/etf_cockpit/data/health.py tests/test_release_gate.py tests/test_issue_0177_observability.py tests/test_issue_0178_validation_classifier.py tests/test_issue_0179_atomic_generation.py tests/test_issue_0179_validation_summary.py tests/test_issue_0180_parallel_pilot.py tests/test_data_health.py
          python -m mypy --ignore-missing-imports --disable-error-code=import-untyped --follow-imports=skip scripts/release_gate.py scripts/profile_parallel_pytest.py scripts/aggregate_parallel_pilot.py scripts/classify_validation.py scripts/generate_programme.py scripts/validation_summary.py scripts/github_mutation_gateway.py scripts/apply_reviewed_status_completion.py scripts/sync_github_issues.py scripts/prepare_github_mutation_authority.py src/etf_cockpit/data/health.py
          python -m compileall -q scripts/github_mutation_gateway.py scripts/apply_reviewed_status_completion.py scripts/sync_github_issues.py scripts/prepare_github_mutation_authority.py

      - name: Run protected release gate
        shell: bash
        env:
          ETF_COCKPIT_RELEASE_BUILD: "1"
          ETF_COCKPIT_SETUP_PYTHON_CACHE_HIT: ${{ steps.setup-python.outputs.cache-hit }}
        run: |
          output="artifacts/release/github-${{ github.sha }}/${{ matrix.platform }}"
          arguments=(--root . --output "$output" --allow-unsigned)
          python scripts/release_gate.py "${arguments[@]}"

      - name: Upload release evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: release-gate-${{ github.sha }}-${{ matrix.platform }}
          path: artifacts/release/github-${{ github.sha }}/${{ matrix.platform }}
          if-no-files-found: error

  parallel-pilot:
    name: Parallel pilot (${{ matrix.platform }})
    needs: [classifier, preflight, supply-chain]
    if: >-
      always() && needs.classifier.result == 'success' &&
      needs.preflight.result == 'success' && needs['supply-chain'].result == 'success' &&
      needs.classifier.outputs.parallel_pilot_required == 'true'
    continue-on-error: true
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux
            os: ubuntu-latest
          - platform: windows
            os: windows-latest
    runs-on: ${{ matrix.os }}
    timeout-minutes: 90
    steps:
      - name: Check out source
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Pin reviewed canonical generation base
        shell: bash
        env:
          REVIEWED_BASE_SHA: ${{ needs.classifier.outputs.base_sha }}
          REVIEWED_BASE_REF: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.ref || 'main' }}
        run: |
          if [[ "$REVIEWED_BASE_REF" != "main" ]]; then
            echo "Parallel-pilot control evidence must target main, not $REVIEWED_BASE_REF" >&2
            exit 1
          fi
          if [[ ! "$REVIEWED_BASE_SHA" =~ ^[0-9a-f]{40}$ ]]; then
            echo "Invalid reviewed generation-base SHA: $REVIEWED_BASE_SHA" >&2
            exit 1
          fi
          if ! git cat-file -e "${REVIEWED_BASE_SHA}^{commit}" 2>/dev/null; then
            git fetch --no-tags origin "$REVIEWED_BASE_SHA"
          fi
          git update-ref refs/remotes/origin/main "$REVIEWED_BASE_SHA"
          test "$(git rev-parse origin/main)" = "$REVIEWED_BASE_SHA"

      - name: Set up pinned Python and cache
        id: setup-python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12.10"
          cache: pip
          cache-dependency-path: |
            requirements-release.txt
            requirements-release-parsers.txt

      - name: Configure isolated user profile
        shell: bash
        run: |
          profile="${RUNNER_TEMP}/etf-cockpit-profile-${{ matrix.platform }}"
          mkdir -p "$profile/config" "$profile/cache" "$profile/data"
          {
            echo "HOME=$profile"
            echo "USERPROFILE=$profile"
            echo "APPDATA=$profile/config"
            echo "LOCALAPPDATA=$profile/data"
            echo "XDG_CONFIG_HOME=$profile/config"
            echo "XDG_CACHE_HOME=$profile/cache"
            echo "PIP_CACHE_DIR=$profile/cache/pip"
          } >> "$GITHUB_ENV"

      - name: Install pinned pilot environment
        shell: bash
        run: |
          python -m pip install --upgrade pip
          python -m pip install --requirement requirements-release.txt
          python -m pip install --requirement requirements-release-parsers.txt

      - name: Verify protected environment
        shell: bash
        env:
          ETF_COCKPIT_SETUP_PYTHON_CACHE_HIT: ${{ steps.setup-python.outputs.cache-hit }}
        run: python scripts/release_gate.py --root . --verify-environment

      - name: Prepare pilot evidence directory
        shell: bash
        run: mkdir -p "${RUNNER_TEMP}/etf-cockpit-parallel-pilot-${{ matrix.platform }}"

      - name: Run repeated report-only four-worker pilot
        shell: bash
        env:
          ETF_COCKPIT_SETUP_PYTHON_CACHE_HIT: ${{ steps.setup-python.outputs.cache-hit }}
          ETF_COCKPIT_PLATFORM: ${{ matrix.platform }}
        run: |
          # Candidate repetitions collect without xdist, then run safe tests
          # with four workers and serial-marked tests sequentially.  The
          # serial release gate remains authoritative; this job is evidence.
          python scripts/profile_parallel_pytest.py \
            --root . \
            --output "${RUNNER_TEMP}/etf-cockpit-parallel-pilot-${{ matrix.platform }}" \
            --repetitions "${{ needs.classifier.outputs.parallel_pilot_repetitions }}"

      - name: Ensure pilot evidence directory for upload
        if: always()
        shell: bash
        run: |
          evidence="${RUNNER_TEMP}/etf-cockpit-parallel-pilot-${{ matrix.platform }}"
          mkdir -p "$evidence"
          if [[ ! -e "$evidence/parallel-pilot.json" ]]; then
            printf 'pilot did not produce a report before failure\n' > "$evidence/pilot-failure.marker"
          fi

      - name: Upload parallel pilot evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: parallel-pilot-${{ github.sha }}-${{ matrix.platform }}
          path: ${{ runner.temp }}/etf-cockpit-parallel-pilot-${{ matrix.platform }}
          if-no-files-found: error

  parallel-pilot-aggregate:
    name: Parallel pilot cross-platform aggregation
    needs: [classifier, preflight, supply-chain, parallel-pilot]
    if: >-
      always() && needs.classifier.result == 'success' &&
      needs.preflight.result == 'success' && needs['supply-chain'].result == 'success' &&
      needs.classifier.outputs.parallel_pilot_required == 'true' &&
      needs['parallel-pilot'].result == 'success'
    continue-on-error: true
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Prepare aggregate evidence directory
        shell: bash
        run: mkdir -p validation-evidence/parallel-pilot

      - name: Download Linux and Windows pilot evidence
        uses: actions/download-artifact@v4
        with:
          pattern: parallel-pilot-${{ github.sha }}-*
          path: validation-evidence/parallel-pilot

      - name: Compare cross-platform pilot evidence
        shell: bash
        run: |
          python scripts/aggregate_parallel_pilot.py \
            --linux-report "validation-evidence/parallel-pilot/parallel-pilot-${{ github.sha }}-linux/parallel-pilot.json" \
            --windows-report "validation-evidence/parallel-pilot/parallel-pilot-${{ github.sha }}-windows/parallel-pilot.json" \
            --output validation-evidence/parallel-pilot/cross-platform.json

      - name: Upload cross-platform pilot evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: parallel-pilot-${{ github.sha }}-cross-platform
          path: validation-evidence/parallel-pilot
          if-no-files-found: error

  validation-summary:
    if: always()
    needs: [classifier, preflight, supply-chain, release-gate]
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Download exact validation artifacts
        uses: actions/download-artifact@v4
        with:
          path: validation-evidence

      - name: Evaluate required validation
        env:
          CLASSIFIER_RESULT: ${{ needs.classifier.result }}
          PREFLIGHT_RESULT: ${{ needs.preflight.result }}
          SUPPLY_CHAIN_RESULT: ${{ needs['supply-chain'].result }}
          RELEASE_GATE_RESULT: ${{ needs['release-gate'].result }}
          PACKAGE_GATE_REQUIRED: ${{ needs.classifier.outputs.package_gate_required }}
        run: |
          python - <<'PY'
          import os
          from scripts.classify_validation import validation_summary_failures

          failures = validation_summary_failures(
              package_gate_required=os.environ["PACKAGE_GATE_REQUIRED"] == "true",
              classifier=os.environ["CLASSIFIER_RESULT"],
              preflight=os.environ["PREFLIGHT_RESULT"],
              supply_chain=os.environ["SUPPLY_CHAIN_RESULT"],
              release_gate=os.environ["RELEASE_GATE_RESULT"],
          )
          if failures:
              raise SystemExit("\n".join(failures))
          PY

      - name: Build and validate authoritative terminal evidence
        if: always()
        env:
          BASE_SHA: ${{ needs.classifier.outputs.base_sha }}
          HEAD_SHA: ${{ needs.classifier.outputs.head_sha }}
          CLASSIFIER_RESULT: ${{ needs.classifier.result }}
          PREFLIGHT_RESULT: ${{ needs.preflight.result }}
          SUPPLY_RESULT: ${{ needs['supply-chain'].result }}
          RELEASE_RESULT: ${{ needs['release-gate'].result }}
        run: |
          python scripts/validation_summary.py \
            --root . \
            --artifacts-root validation-evidence \
            --base "$BASE_SHA" \
            --head "$HEAD_SHA" \
            --job-result "classifier=$CLASSIFIER_RESULT" \
            --job-result "preflight=$PREFLIGHT_RESULT" \
            --job-result "supply_chain=$SUPPLY_RESULT" \
            --job-result "release=$RELEASE_RESULT" \
            --output validation-evidence/terminal-summary.json

      - name: Upload terminal validation summary
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: validation-summary-${{ github.sha }}
          path: validation-evidence/terminal-summary.json
          if-no-files-found: error
