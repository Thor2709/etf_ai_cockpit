# Tunable-knob registry for bounded parameter optimisation (issue #262).
# Read-only: the tuner reads the CURRENT value of every knob from its source file and never
# writes to any settings file; output is a proposal artefact only (execution_allowed=false).
# Bounds/step are conservative +/-0.10 around today's weights (clamped to [0, 1]); weights that
# share a `group` are rescaled to keep the group's current total. `model` marks knobs whose
# evidence depends on an optional forecast model, so pretraining cutoffs apply to them.
# NS1: every knob reads configs/score_engine_v3.yaml, the single weight source. score.etf.headline.*
# are the headline evidence composite (asset_policies.ETF.headline_evidence), ensemble.* the
# action/gate composite (action_composite.weights; no rebalance term), score.etf.expected_return.*
# the separate model-forecast domain. No knob exists for the STOCK weights or the group blend.
schema_version: 1
version: tuning-v1
defaults:
  search:
    max_trials: 60
    max_seconds: 60.0
    max_memory_mb: 256
    seed: 42
    refine_after: 8        # trials before the seeded one-step local refinement of the best trial
    patience: 25           # stop after this many consecutive non-improving completed trials
    prune_warmup_trials: 5 # completed trials needed before median pruning applies
  guards:
    min_tune_samples: 250
    min_eval_samples: 60
    eval_blocks: 4
    min_block_win_fraction: 0.75
    change_penalty: 0.02   # score units per unit of mean normalised distance from current
    min_improvement: 0.0   # extra out-of-sample margin required on top of the penalty
  split:
    eval_size: 120
    horizon: 20
    embargo: 0
    final_test_size: 60    # reserved tail, never used for tuning or evaluation
parameters:
  - key: score.etf.headline.momentum
    file: score_engine_v3.yaml
    path: [asset_policies, ETF, headline_evidence, momentum]
    lower: 0.12
    upper: 0.32
    step: 0.05
    group: score.etf.headline
  - key: score.etf.headline.trend
    file: score_engine_v3.yaml
    path: [asset_policies, ETF, headline_evidence, trend]
    lower: 0.08
    upper: 0.28
    step: 0.05
    group: score.etf.headline
  - key: score.etf.headline.relative_strength
    file: score_engine_v3.yaml
    path: [asset_policies, ETF, headline_evidence, relative_strength]
    lower: 0.04
    upper: 0.24
    step: 0.05
    group: score.etf.headline
  - key: score.etf.headline.etf_exposure
    file: score_engine_v3.yaml
    path: [asset_policies, ETF, headline_evidence, etf_exposure]
    lower: 0.0
    upper: 0.2
    step: 0.05
    group: score.etf.headline
  - key: score.etf.expected_return.baseline
    file: score_engine_v3.yaml
    path: [asset_policies, ETF, expected_return, baseline]
    lower: 0.5
    upper: 0.7
    step: 0.05
    group: score.etf.expected_return
  - key: score.etf.expected_return.timesfm
    file: score_engine_v3.yaml
    path: [asset_policies, ETF, expected_return, timesfm]
    lower: 0.1
    upper: 0.3
    step: 0.05
    group: score.etf.expected_return
    model: timesfm
  - key: score.etf.expected_return.toto
    file: score_engine_v3.yaml
    path: [asset_policies, ETF, expected_return, toto]
    lower: 0.1
    upper: 0.3
    step: 0.05
    group: score.etf.expected_return
    model: toto
  - key: ensemble.momentum
    file: score_engine_v3.yaml
    path: [action_composite, weights, momentum]
    lower: 0.1
    upper: 0.3
    step: 0.05
    group: ensemble.weights
  - key: ensemble.trend
    file: score_engine_v3.yaml
    path: [action_composite, weights, trend]
    lower: 0.05
    upper: 0.25
    step: 0.05
    group: ensemble.weights
  - key: ensemble.risk
    file: score_engine_v3.yaml
    path: [action_composite, weights, risk]
    lower: 0.0
    upper: 0.2
    step: 0.05
    group: ensemble.weights
  - key: ensemble.relative_strength
    file: score_engine_v3.yaml
    path: [action_composite, weights, relative_strength]
    lower: 0.0
    upper: 0.2
    step: 0.05
    group: ensemble.weights
  - key: ensemble.toto
    file: score_engine_v3.yaml
    path: [action_composite, weights, toto]
    lower: 0.05
    upper: 0.25
    step: 0.05
    group: ensemble.weights
    model: toto
  - key: ensemble.timesfm
    file: score_engine_v3.yaml
    path: [action_composite, weights, timesfm]
    lower: 0.0
    upper: 0.2
    step: 0.05
    group: ensemble.weights
    model: timesfm
  - key: ensemble.baseline_ml
    file: score_engine_v3.yaml
    path: [action_composite, weights, baseline_ml]
    lower: 0.0
    upper: 0.15
    step: 0.05
    group: ensemble.weights
  - key: ensemble.chatgpt_thesis
    file: score_engine_v3.yaml
    path: [action_composite, weights, chatgpt_thesis]
    lower: 0.0
    upper: 0.15
    step: 0.05
    group: ensemble.weights
