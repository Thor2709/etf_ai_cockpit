# Tunable-knob registry for bounded parameter optimisation (issue #262).
# Read-only: the tuner reads the CURRENT value of every knob from its source file and never
# writes to any settings file; output is a proposal artefact only (execution_allowed=false).
# OD-5 scope: the headline evidence weights of ETF and STOCK only (asset_policies.<ETF|STOCK>.headline_evidence in
# configs/score_engine_v3.yaml, the single weight source); no action-composite, model-forecast or per-sector knobs.
# Each policy's knobs are one group rescaled to the policy's current total (1.0), so every grid combination is
# feasible. PSF: momentum+trend are one price-strength family capped at 30% of the table; their upper bounds are
# today's values (which sum to the cap), so no combination exceeds it. Other bounds are +/-0.10 around today's
# weights; weights at 0 today (relative_strength, etf_exposure, analyst_revision, forecasts) have no knob.
schema_version: 1
version: tuning-v1
defaults:
  search:
    max_trials: 60
    max_seconds: 60.0
    max_memory_mb: 256
    seed: 42
    refine_after: 8        # trials before the seeded one-step local refinement of the best trial
    patience: 25           # stop after this many consecutive non-improving completed trials
    prune_warmup_trials: 5 # completed trials needed before median pruning applies
  guards:
    min_tune_samples: 250
    min_eval_samples: 60
    eval_blocks: 4
    min_block_win_fraction: 0.75
    change_penalty: 0.02   # score units per unit of mean normalised distance from current
    min_improvement: 0.0   # extra out-of-sample margin required on top of the penalty
  split:
    eval_size: 120
    horizon: 20
    embargo: 0
    final_test_size: 60    # reserved tail, never used for tuning or evaluation
parameters:
  - {key: score.etf.headline.momentum, file: score_engine_v3.yaml, path: [asset_policies, ETF, headline_evidence, momentum], lower: 0.1, upper: 0.165, step: 0.05, group: score.etf.headline}
  - {key: score.etf.headline.trend, file: score_engine_v3.yaml, path: [asset_policies, ETF, headline_evidence, trend], lower: 0.08, upper: 0.135, step: 0.05, group: score.etf.headline}
  - {key: score.etf.headline.risk, file: score_engine_v3.yaml, path: [asset_policies, ETF, headline_evidence, risk], lower: 0.3083, upper: 0.5083, step: 0.05, group: score.etf.headline}
  - {key: score.etf.headline.liquidity_cost, file: score_engine_v3.yaml, path: [asset_policies, ETF, headline_evidence, liquidity_cost], lower: 0.1917, upper: 0.3917, step: 0.05, group: score.etf.headline}
  - {key: score.stock.headline.momentum, file: score_engine_v3.yaml, path: [asset_policies, STOCK, headline_evidence, momentum], lower: 0.1242, upper: 0.1742, step: 0.05, group: score.stock.headline}
  - {key: score.stock.headline.trend, file: score_engine_v3.yaml, path: [asset_policies, STOCK, headline_evidence, trend], lower: 0.0758, upper: 0.1258, step: 0.05, group: score.stock.headline}
  - {key: score.stock.headline.risk, file: score_engine_v3.yaml, path: [asset_policies, STOCK, headline_evidence, risk], lower: 0.0787069238, upper: 0.2787069238, step: 0.05, group: score.stock.headline}
  - {key: score.stock.headline.liquidity_cost, file: score_engine_v3.yaml, path: [asset_policies, STOCK, headline_evidence, liquidity_cost], lower: 0.0489408789, upper: 0.2489408789, step: 0.05, group: score.stock.headline}
  - {key: score.stock.headline.stock_value, file: score_engine_v3.yaml, path: [asset_policies, STOCK, headline_evidence, stock_value], lower: 0.0787069238, upper: 0.2787069238, step: 0.05, group: score.stock.headline}
  - {key: score.stock.headline.stock_quality, file: score_engine_v3.yaml, path: [asset_policies, STOCK, headline_evidence, stock_quality], lower: 0.0936452735, upper: 0.2936452735, step: 0.05, group: score.stock.headline}
