schema_version: 1
storage_schema_version: 4
policy_id: local-hybrid-storage-v1
transactional:
  engine: sqlite
  path: data/storage/cockpit.sqlite3
  journal_mode: wal
  foreign_keys: required
  purpose: user-owned journals, experiments, portfolios, orders and reconciliation state
analytics:
  engine: duckdb
  source_format: parquet
  root: data/analytics
  purpose: large histories, features, scores and analytical snapshots
migrations:
  state: data/storage/schema_migrations
  startup: idempotent
  unknown_versions: fail_closed
integrity:
  sqlite_check: required_before_export
  parquet_validation: required_before_publish
retention:
  default: retain_until_explicit_user_action
  automatic_deletion: false
  compaction: explicit_local_operation_only
exports:
  format: parquet
  destination: exports/storage
  include_deleted: opt_in
  private_fields: excluded_by_default
  explicit_private_export_confirmation: required
encryption:
  backup_algorithm: Fernet
  key_derivation: PBKDF2HMAC-SHA256
  iterations: 390000
  minimum_recovery_key_bytes: 16
  key_storage: user_managed_only
  wrong_or_corrupt_key: fail_closed_without_writes
backups:
  format: encrypted_backup_v1
  incremental_checksums: required
  default_retention: 5
  secret_and_transient_exclusion: required
  restore: preview_then_atomic_commit
recovery:
  disaster_drill: local_create_validate_restore
  remote_service_dependency: false
  deletion_scope: data/private_only
local_first:
  network_required: false
  remote_quota_failure: non_blocking
