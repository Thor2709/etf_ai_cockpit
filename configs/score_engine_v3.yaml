schema_version: 1
formula_version: score-engine-v3.2.0
# PSF (v3.2.0): momentum + trend are ONE price-strength family capped at 30% of every configured weight table
# (attractiveness, headline_evidence, action_composite; per asset class). relative_strength stays a displayed/research
# feature but carries weight 0 while one global anchor is used (a single subtracted anchor cannot change ranks, B-01).
# Weight freed by the cap went proportionally to the non-price families; a model that is unavailable never has its
# weight moved to momentum/trend (ensemble.effective_ensemble_weights), and the price-derived baseline_ml fallback is
# a labelled heuristic that carries no weight.
horizons:
  primary: 1-3 months
asset_policies:
