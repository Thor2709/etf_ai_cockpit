schema_version: 1
# Normal-stock (non-bank) fundamentals, valuation and score inputs. Read by
# etf_cockpit.analysis.stock_evidence and etf_cockpit.data.stock_fundamentals.
# Every number here is an explicit, documented default: change it here, never in code.

scope:
  # normal stocks only: banks and equity certificates have their own scorecard
  excluded_sectors: [Banks, Bank, Savings banks]

sources:
  # Fallback chain per instrument: the first source that yields the core fields wins; gaps are
  # filled from later sources only for the same period and currency, and recorded per field.
  chain: [sec_edgar, esef, yfinance]
  # `esef` reads the ESEF/IFRS statement facts already imported into data/clean/statement_facts.parquet (filings.xbrl.org
  # packages); known_at is the registry date_added of each filing. It performs no network request.
  # SEC EDGAR needs a descriptive User-Agent (fair-access policy). Set the environment variable
  # ETF_COCKPIT_SEC_EDGAR_USER_AGENT to "<name> <contact>"; without it EDGAR is reported unavailable.
  sec_edgar_user_agent_env: ETF_COCKPIT_SEC_EDGAR_USER_AGENT
  core_fields: [revenue, net_income_parent, equity_parent]

yfinance_labels:
  # field -> ordered statement row labels (first present wins)
  revenue: [Total Revenue, Operating Revenue]
  gross_profit: [Gross Profit]
  ebit: [Operating Income, EBIT]
  da: [Depreciation And Amortization, Reconciled Depreciation, Depreciation Amortization Depletion]
  pretax_income: [Pretax Income]
  income_tax: [Tax Provision]
  interest_expense: [Interest Expense, Interest Expense Non Operating]
  net_income_parent: [Net Income Common Stockholders, Net Income]
  cfo: [Operating Cash Flow, Cash Flow From Continuing Operating Activities]
  capex: [Capital Expenditure, Purchase Of PPE]
  dividends_paid: [Cash Dividends Paid, Common Stock Dividend Paid]
  equity_parent: [Stockholders Equity, Common Stock Equity]
  minority_interest: [Minority Interest]
  total_debt: [Total Debt]
  lease_liabilities: [Capital Lease Obligations]
  cash_sti: [Cash Cash Equivalents And Short Term Investments, Cash And Cash Equivalents]
  total_assets: [Total Assets]
  shares_outstanding: [Ordinary Shares Number, Share Issued]

sec_edgar_concepts:
  # field -> us-gaap concepts (earliest filing wins, order breaks same-day ties). Debt is the sum of the listed parts
  # that are reported (current + non-current), never a guess for a missing part.
  revenue: [Revenues, RevenueFromContractWithCustomerExcludingAssessedTax, SalesRevenueNet, RevenueFromContractWithCustomerIncludingAssessedTax]
  gross_profit: [GrossProfit]
  ebit: [OperatingIncomeLoss]
  da: [DepreciationDepletionAndAmortization, DepreciationAndAmortization, DepreciationAmortizationAndAccretionNet]
  pretax_income: [IncomeLossFromContinuingOperationsBeforeIncomeTaxesExtraordinaryItemsNoncontrollingInterest, IncomeLossFromContinuingOperationsBeforeIncomeTaxesMinorityInterestAndIncomeLossFromEquityMethodInvestments]
  income_tax: [IncomeTaxExpenseBenefit]
  interest_expense: [InterestExpense, InterestExpenseNonoperating]
  net_income_parent: [NetIncomeLoss]
  cfo: [NetCashProvidedByUsedInOperatingActivities]
  capex: [PaymentsToAcquirePropertyPlantAndEquipment, PaymentsToAcquireProductiveAssets]
  capex_extra: [PaymentsToAcquireIntangibleAssets]
  dividends_paid: [PaymentsOfDividendsCommonStock, PaymentsOfDividends]
  equity_parent: [StockholdersEquity]
  minority_interest: [MinorityInterest]
  debt_parts: [LongTermDebtNoncurrent, LongTermDebtCurrent, ShortTermBorrowings, CommercialPaper]
  debt_total: [LongTermDebt, DebtAndCapitalLeaseObligations]
  lease_parts: [OperatingLeaseLiabilityNoncurrent, OperatingLeaseLiabilityCurrent, FinanceLeaseLiabilityNoncurrent, FinanceLeaseLiabilityCurrent]
  cash: [CashAndCashEquivalentsAtCarryingValue]
  short_term_investments: [ShortTermInvestments, MarketableSecuritiesCurrent, AvailableForSaleSecuritiesDebtSecuritiesCurrent]
  total_assets: [Assets]
  shares_outstanding: [CommonStockSharesOutstanding]

sec_edgar_rules:
  # A fact for an earlier period than the latest period in its filing is a
  # comparative and is excluded even when it falls inside the lag below.
  # Original 10-K/10-Q facts only; facts first seen more than 120 days after
  # their period end are excluded as late comparatives, not used to delay a row.
  max_original_filing_lag_days: 120
  # Cover-page publications retain their actual instant and filing-date known_at.
  # Conflicting classes/counts remain unavailable; no inferred split adjustment.
  dei_shares: [EntityCommonStockSharesOutstanding]

esef_concepts:
  # field -> ordered ifrs-full concepts (consolidated, undimensioned facts; the earliest-known filing wins a period,
  # the order only breaks a tie). "Concept[Member]" selects the single-dimension ComponentsOfEquityAxis fact of that
  # member (closing balance in the statement of changes in equity); used only as a fallback behind the face statement.
  # Annual (fiscal-year) periods only: ESEF packages carry annual reports. A field nobody tagged stays unavailable.
  revenue: [Revenue, RevenueFromContractsWithCustomers]
  gross_profit: [GrossProfit]
  ebit: [ProfitLossFromOperatingActivities]
  da: [DepreciationAndAmortisationExpense, AdjustmentsForDepreciationAndAmortisationExpense]
  pretax_income: [ProfitLossBeforeTax]
  income_tax: [IncomeTaxExpenseContinuingOperations]
  interest_expense: [InterestExpense]
  net_income_parent: [ProfitLossAttributableToOwnersOfParent]
  cfo: [CashFlowsFromUsedInOperatingActivities]
  capex: [PurchaseOfPropertyPlantAndEquipmentClassifiedAsInvestingActivities]
  capex_extra: [PurchaseOfIntangibleAssetsClassifiedAsInvestingActivities]
  dividends_paid: [DividendsPaidClassifiedAsFinancingActivities, DividendsPaidToEquityHoldersOfParentClassifiedAsFinancingActivities]
  cfi: [CashFlowsFromUsedInInvestingActivities]
  cff: [CashFlowsFromUsedInFinancingActivities]
  fx_effect: [EffectOfExchangeRateChangesOnCashAndCashEquivalents]
  equity_parent: [EquityAttributableToOwnersOfParent, "Equity[EquityAttributableToOwnersOfParentMember]"]
  minority_interest: [NoncontrollingInterests, "Equity[NoncontrollingInterestsMember]"]
  debt_total: [Borrowings]
  debt_noncurrent: [LongtermBorrowings, NoncurrentPortionOfNoncurrentBorrowings]
  debt_current: [CurrentBorrowingsAndCurrentPortionOfNoncurrentBorrowings, ShorttermBorrowings, CurrentBorrowings]
  lease_total: [LeaseLiabilities]
  lease_noncurrent: [NoncurrentLeaseLiabilities]
  lease_current: [CurrentLeaseLiabilities]
  cash: [CashAndCashEquivalents]
  total_assets: [Assets]
  total_liabilities: [Liabilities]
  shares_outstanding: [NumberOfSharesOutstanding]

esef_rules:
  # a share count is accepted only when every filing that reports the date agrees within this relative tolerance
  # (filings disagree by thousands when one reports in thousands); otherwise it is conflicted, never picked
  share_count_agreement: 0.01
  # payments are stored as the positive outflow, as in the SEC path
  absolute_value_fields: [capex, capex_extra, dividends_paid, interest_expense]

reporting:
  quarters_for_ttm: 4
  # four consecutive quarter ends span 270 days; accept 240..300 (a stale or gappy series is not a TTM)
  ttm_span_days: [240, 300]
  minor_currency_units: {GBp: [GBP, 0.01], GBX: [GBP, 0.01], ILA: [ILS, 0.01], ZAc: [ZAR, 0.01]}
  max_balance_staleness_days: 400
  # Maximum fiscal-calendar drift when combining balance-sheet claims and flows.
  balance_flow_tolerance_days: 45

growth:
  years: 3

valuation:
  history_years: 5
  history_min_points: 12
  # a filing share count that differs from the provider count by more than this is treated as a share-class or split mismatch
  share_count_tolerance: 0.25
  # Reverse valuation inputs. Left empty on purpose: the app must not invent a cost of equity.
  # With cost_of_equity unset every reverse-valuation figure is reported unavailable with that reason.
  cost_of_equity: null
  terminal_growth: null
  stage1_years: 5

peers:
  min_for_score: 3
  size_bands_market_cap_eur_bn: [2, 10, 50]
  min_score: 2
  max_auto: 8
  weights: {industry: 3, sector: 2, region: 1, size_band: 1}

scoring:
  # Value and quality inputs are scored as the percentile (mid-rank) of the instrument inside its peer cohort:
  # industry, widening to sector, then region, then the whole stock universe, at the first level with at least
  # `min_peers` peers that report the input. If no level qualifies the input is unavailable (never the ladder below).
  # The low/high ladders below apply only when a caller supplies no cohort context at all (cohort_level
  # `absolute_unadjusted`). A non-positive yield (earnings/FCF/EBIT-EV) is capped at `negative_yield_score_cap`
  # so it can never rank as cheap; 0.0 matches `loss_subscore`.
  cohort:
    min_peers: 3
    negative_yield_score_cap: 0.0
  # Noisy fundamentals from few annual observations are pulled toward the cohort (sector -> ladder) median:
  # shrunk = w * raw + (1 - w) * cohort median, w = n / (n + k), n = annual observations. Raw and shrunk are both
  # stored; the score uses the shrunk value. No cohort median -> the input is not scored (no invented prior).
  shrinkage:
    k: 4
  # Informational uncertainty bands (never raise a score, never bypass a gate): bootstrap p10/p90 of the cohort
  # percentile. label_stable is false when a band spans a headline-label boundary (see final_label_from_scores).
  uncertainty:
    lower_quantile: 0.10
    upper_quantile: 0.90
    bootstrap_samples: 200
    label_boundaries: [4.0, 5.0, 6.5, 8.0]
  # sub-score mapping: value at/below `low` -> 0, at/above `high` -> 10, linear in between
  # (`low` may exceed `high` for "lower is better" inputs). weight is the share inside the component.
  value:
    min_inputs: 2
    earnings_yield: {low: 0.0, high: 0.10, weight: 1}
    fcf_yield: {low: 0.0, high: 0.10, weight: 1}
    ebit_ev_yield: {low: 0.0, high: 0.10, weight: 1}
    pe_history_percentile: {low: 1.0, high: 0.0, weight: 1}
    pe_vs_peers_discount: {low: -0.5, high: 0.5, weight: 1}
  quality:
    min_inputs: 2
    roe: {low: 0.0, high: 0.20, weight: 1}
    roic: {low: 0.0, high: 0.15, weight: 1}
    ebit_margin: {low: 0.0, high: 0.25, weight: 1}
    net_debt_to_ebitda: {low: 4.0, high: 0.0, weight: 1}
    fcf_conversion: {low: 0.0, high: 1.0, weight: 1}
    revenue_cagr: {low: -0.05, high: 0.10, weight: 1}
  cyclical:
    # Reuse the established value and operating-margin ranges for the sector adapter's core evidence.
    value_ev_earnings_yield: {low: 0.0, high: 0.10}
    quality_normalised_margin: {low: 0.0, high: 0.25}
  analyst_revision:
    min_inputs: 1
    eps_estimate_change_90d: {low: -0.10, high: 0.10, weight: 1}
    up_share_30d: {low: 0.0, high: 1.0, weight: 1}
    min_analysts: 3
  # a loss-making company scores 0 on the yield-type value inputs and on ROE/ROIC/margin (known losses, not missing data)
  loss_subscore: 0.0

text:
  percentile_cheap: 0.25
  percentile_expensive: 0.75
  peer_premium_pct: 0.10
  strong_score: 7.0
  weak_score: 4.0
