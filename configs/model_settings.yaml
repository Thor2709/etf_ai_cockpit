# Provenance (metadata only, #943): each checkpoint is judged on its own record (SHA, config, licence,
# cutoff). TimesFM 3.0 is non-commercial (owner-approved for personal use) and its 2023-11-30 cutoff is partial
# leakage evidence; that cutoff is never reused for TimesFM 2.5 or Toto 2.0 (unpublished, treated as unknown).
# Forecast values are adjusted-close LOG returns; show percentages via exp(y) - 1. Logistic p-up / p-beat
# scores are heuristic_probability_* and not shown as probabilities without out-of-sample calibration.
# Owner opt-in: shadow_optional_models: true runs the optional models (TimesFM 2.5/3.0,
# Toto 2.0) in every forecast run of the refresh workflow. Whether their forecasts count in
# scores is decided automatically by the `promotion` block below, never by this flag.
# Optional model family: timesfm3 uses backend timesfm3 and local
# model_path models/timesfm/timesfm-3.0-pytorch; enabled: true, mode: live,
# device: auto, local_files_only: true, allow_remote_download: false.
forecast_horizons_trading_days: [5, 20, 60, 120, 180]
models:
  baseline:
    enabled: true
  timesfm:
    enabled: true
    mode: live
    backend: transformers
    hf_repo_id: google/timesfm-2.5-200m-transformers
    model_path: models/timesfm/timesfm-2.5-200m-transformers
    local_files_only: true
    allow_remote_download: false
    context_length: 2048
    use_quantiles: true
    device: auto
    timeout_seconds: 60
  toto:
    enabled: true
    mode: live
    backend: toto2
    model_size: 1b
    hf_repo_id: Datadog/Toto-2.0-1B
    hf_repo_ids:
      4m: Datadog/Toto-2.0-4m
      22m: Datadog/Toto-2.0-22m
      313m: Datadog/Toto-2.0-313m
      1b: Datadog/Toto-2.0-1B
      2.5b: Datadog/Toto-2.0-2.5B
    model_path: models/toto/Toto-2.0-1B
    local_files_only: true
    allow_remote_download: false
    context_length: 2048
    device: auto
    timeout_seconds: 180
    decode_block_size: 768
  lightgbm:
    enabled: false
# Automatic, evidence-based promotion. An optional model counts in scores only when its matured
# out-of-sample forecasts beat the baseline (lower MASE, no lower direction accuracy, calibration
# not weak) on the same instruments, dates, version and evidence horizon only.
# Every optional model's prospective evidence starts after its first verified local run (created_at).
# TimesFM 3.0's 2023-11-30 cutoff covers only some pretraining corpora; it is not a complete cutoff.
# Origins on or before that declared cutoff are excluded too. 100 matured pairs over 5 forecast dates is deliberately conservative: pairs from one date
# share the market move, so the date minimum limits that clustering. enabled: false = diagnostic only.
promotion:
  enabled: true
  minimum_matured_forecasts: 100
  minimum_forecast_origins: 5
  evidence_horizon_days: 60
# The action/gate composite weights live in score_engine_v3.yaml (action_composite.weights); load_config injects
# them as ensemble.weights. Carrying weights here is a configuration error.
ensemble:
  allow_dynamic_weights: false
