schema_version: "performance-budgets.v1"
policy_version: "2026-07-17"
regression_tolerance_pct: 10.0
budgets:
  - {metric_id: startup_cold, category: startup, unit: ms, limit: 5000, tolerance_pct: 10, description: Cold source startup readiness.}
  - {metric_id: first_durable_event, category: workflow, unit: ms, limit: 2000, tolerance_pct: 10, description: Workflow creation and first durable event.}
  - {metric_id: route_render, category: ui, unit: ms, limit: 1000, tolerance_pct: 10, description: Representative route render.}
  - {metric_id: common_query, category: query, unit: ms, limit: 500, tolerance_pct: 10, description: Common local query response.}
  - {metric_id: refresh, category: refresh, unit: ms, limit: 10000, tolerance_pct: 10, description: Offline local refresh.}
  - {metric_id: screen_100, category: screen, unit: ms, limit: 1000, tolerance_pct: 10, dataset_size: 100, description: 100-instrument screen.}
  - {metric_id: screen_1000, category: screen, unit: ms, limit: 3000, tolerance_pct: 10, dataset_size: 1000, description: 1,000-instrument screen.}
  - {metric_id: screen_10000, category: screen, unit: ms, limit: 10000, tolerance_pct: 10, dataset_size: 10000, description: 10,000-instrument screen.}
  - {metric_id: backtest, category: backtest, unit: ms, limit: 30000, tolerance_pct: 10, description: Representative local backtest.}
  - {metric_id: training, category: training, unit: ms, limit: 120000, tolerance_pct: 10, description: Optional model training budget.}
  - {metric_id: app_peak_memory, category: memory, unit: MiB, limit: 1024, tolerance_pct: 10, description: Peak application memory.}
  - {metric_id: local_storage, category: storage, unit: bytes, limit: 10737418240, tolerance_pct: 10, description: Local user data and evidence storage.}
