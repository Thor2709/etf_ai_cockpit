completion_contract:
  - Every registered route, dataset dependency, model, strategy and broker capability has one stage.
  - Research outputs remain non-executable and user-owned.
  - Optional providers and models may be unavailable without breaking the mandatory local core.
  - Authority cannot be promoted by configuration alone; prerequisite evidence and a separate approved release are required.
  - No completion wording promises returns or equivalence with a proprietary institutional platform.
