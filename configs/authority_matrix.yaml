authority_stages:
  - {stage_id: research, label: Research, description: Evidence and deterministic analysis for human review., enabled_by_default: true, execution_allowed: false}
  - {stage_id: shadow_proposal, label: Shadow proposal, description: Frozen non-executable proposal preview after research gates., enabled_by_default: false, execution_allowed: false}
  - {stage_id: paper, label: Paper, description: Local simulation and forward evidence only., enabled_by_default: false, execution_allowed: false}
  - {stage_id: broker_read_only, label: Broker read-only, description: Reserved read-only reconciliation stage with no credentials or orders in this release., enabled_by_default: false, execution_allowed: false}
  - {stage_id: draft_order, label: Draft order, description: Disabled draft contract reserved for a separately approved future programme., enabled_by_default: false, execution_allowed: false}
  - {stage_id: capped_automatic, label: Capped automatic, description: Disabled canary stage requiring separate authority and release evidence., enabled_by_default: false, execution_allowed: false}
  - {stage_id: disabled, label: Disabled, description: Declared capability is unavailable and cannot influence mandatory workflows., enabled_by_default: false, execution_allowed: false}
