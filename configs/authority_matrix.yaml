schema_version: "1.0"
policy_id: authority-matrix
policy_version: "2026-07-17"
execution_allowed: false
executable_authority: false
adr_id: ADR-0070-v1
adr_path: docs/architecture/ADR-0070-product-scope-and-authority.md
mandatory_core:
  - local_first_no_subscription
  - adjusted_price_returns
  - evidence_and_risk_gates
  - append_only_audit_trace
  - execution_disabled
optional_enrichment:
  - optional_provider_adapters
  - timesfm_challenger
