approval_policy = "never"

# =============================================================================
# Sandbox
# =============================================================================

sandbox_mode = "workspace-write"

service_tier = "default"
notify = [ "C:\\Users\\thor2\\AppData\\Local\\OpenAI\\Codex\\runtimes\\cua_node\\fb8898c05a62885e\\bin\\node_modules\\@oai\\sky\\bin\\windows\\codex-computer-use.exe", "turn-ended", "--previous-notify", "[]" ]
[sandbox_workspace_write]
exclude_slash_tmp = false
