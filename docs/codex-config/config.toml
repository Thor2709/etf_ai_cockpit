# =============================================================================
# Windows sandbox
# =============================================================================

[windows]

# Elevated mode previously created files under a separate sandbox identity and
# caused credential, ownership and worktree problems on this machine.
#
# Unelevated still enforces filesystem boundaries but derives its restricted
# token from the current Windows user, avoiding cross-account Git ownership
# problems.
sandbox = "unelevated"

# Preserve UI isolation.
sandbox_private_desktop = true


# =============================================================================
# Desktop interface
# =============================================================================

[desktop]
ambient-suggestions-enabled = false
conversationDetailMode = "STEPS_COMMANDS"
followUpQueueMode = "queue"
show-context-window-usage = true

enabled-reasoning-efforts = [
  "low",
  "medium",
  "high",
  "xhigh",
  "ultra",
  "max",
]

show-ultra-in-model-picker-slider = false


# =============================================================================
# MCP servers
#
# No server is pinned to an old repository directory. Each enabled server
# inherits the active project working directory.
# =============================================================================

