# Sanitised durable Codex configuration template.
# Machine paths, plugins, credentials and volatile runtime identifiers are
# intentionally excluded; preserve the effective role matrix in agents/*.toml.
model = "gpt-6-astra"
model_reasoning_effort = "low"
plan_mode_reasoning_effort = "medium"
model_verbosity = "low"
approval_policy = "never"
sandbox_mode = "workspace-write"

[sandbox_workspace_write]
network_access = true
exclude_slash_tmp = false
exclude_tmpdir_env_var = false
writable_roots = []

[agents]
enabled = true
max_concurrent_threads_per_session = 2
default_subagent_model = "gpt-5.6-luna"
default_subagent_reasoning_effort = "high"

[features]
multi_agent = true
multi_agent_v2 = true

[windows]
sandbox = "unelevated"
sandbox_private_desktop = true
